// ---- eventos Espagueti ----
const spRe=()=>{S.keep=true;render(true);S.keep=false;};
function spSync(){['sph','sph2'].forEach(id=>{const f=document.getElementById(id);if(f&&SP.d)new FormData(f).forEach((v,k)=>SP.d[k]=v);});}
function spMiss(d){const m=[];if(!String(d.analista||'').trim())m.push('analista');if(!(spNum(d.escala)>0))m.push('escala');return m;}
// Si el área se achica, los puntos que quedaron fuera se acomodan en la orilla
function spClamp(d){const {c,r}=spDim(d);d.pts.forEach(p=>{p.x=Math.min(p.x,c-1);p.y=Math.min(p.y,r-1);});}
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('mback'))return;
  const d=SP.d;
  // toques en el diagrama (SVG)
  const g=e.target.closest&&e.target.closest('[data-sppt],[data-spcell]');
  if(g&&d&&route()==='sp-nuevo'){
    if(g.dataset.sppt){const id=+g.dataset.sppt;
      if(SP.view==='lay'){SP.sel=SP.sel===id?null:id;spRe();if(SP.sel){const x=document.querySelector('[data-spname]');if(x)x.focus({preventScroll:true});}return;}
      if(SP.view==='ruta'){if(d.ruta[d.ruta.length-1]!==id)d.ruta.push(id);spRe();return;}}
    if(g.dataset.spcell&&SP.view==='lay'){const [x,y]=g.dataset.spcell.split(',').map(Number);
      if(SP.sel!=null){const p=spPt(d,SP.sel);if(p){p.x=x;p.y=y;}SP.sel=null;spRe();return;}
      const id=nid();d.pts.push({id,n:'PUNTO '+(d.pts.length+1),x,y});SP.sel=id;spRe();const n=document.querySelector('[data-spname]');if(n){n.focus({preventScroll:true});n.select();}return;}
    return;}
  const t=e.target.closest('button');if(!t||t.disabled)return;const D=t.dataset;
  if(D.spnew){spNew();go('sp-nuevo');return;}
  if(D.spopen){SP.d=SP.studies.find(x=>x.id==D.spopen);SP.view=SP.d.ruta.length>1?'res':'info';SP.sel=null;SP.miss=[];go('sp-nuevo');return;}
  if(!d||!Object.keys(D).some(k=>k.startsWith('sp')))return;
  if(D.spv){spSync();if(SP.view==='info'&&D.spv!=='info'){SP.miss=spMiss(d);if(SP.miss.length){spRe();return;}spClamp(d);if(!d.titulo)d.titulo='ESPAGUETI SIN TÍTULO';if(!SP.studies.includes(d))SP.studies.unshift(d);}
    SP.view=D.spv;SP.sel=null;render();return;}
  if(D.spset){spSync();d[D.spset]=D.spval;spRe();return;}
  if(D.spexample){d.cols='24';d.rows='14';SP_EX_PTS.forEach(([n,x,y])=>d.pts.push({id:nid(),n,x,y}));SP.sel=null;spRe();return;}
  if(D.spdone){SP.sel=null;spRe();return;}
  if(D.spptdel){const id=+D.spptdel;const n=d.ruta.filter(x=>x===id).length;const go2=()=>{d.pts=d.pts.filter(p=>p.id!==id);d.ruta=d.ruta.filter(x=>x!==id);SP.sel=null;spRe();};
    if(n)ask('¿Quitar el punto?','Está en el recorrido '+n+(n!==1?' veces':' vez')+'; esos trayectos se quitan también.','Quitar punto',go2);else go2();return;}
  if(D.spundo){d.ruta.pop();spRe();return;}
  if(D.spclear){ask('¿Borrar el recorrido?','Se quitan todos los trayectos; los puntos del layout se quedan.','Borrar recorrido',()=>{d.ruta=[];spRe();});return;}
  if(D.spdel){ask('¿Eliminar este diagrama?','Se borra «'+spName(d)+'».','Eliminar',()=>{SP.studies=SP.studies.filter(x=>x!==d);SP.d=null;go('sp');});return;}
  if(D.spfinish){if(!SP.studies.includes(d))SP.studies.unshift(d);storeSave('sp',d);SP.d=null;go('sp');return;}
});
document.addEventListener('input',e=>{const el=e.target;const d=SP.d;if(!d||!el.dataset||route()!=='sp-nuevo')return;
  if(el.closest&&(el.closest('#sph')||el.closest('#sph2'))){spSync();if(SP.miss.length)SP.miss=spMiss(d).filter(k=>SP.miss.includes(k));return;}
  if(el.dataset.spname){const p=spPt(d,+el.dataset.spname);if(p){p.n=el.value;const lb=document.querySelector(`[data-sppt="${p.id}"] .spl`);if(lb)lb.textContent=String(el.value).slice(0,16);}return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.spname){SP.sel=null;spRe();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-sppt]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});

// ===== REPORTES EN PDF · formato común (carta vertical, varias páginas) =====
// Opción A (Angel, 2026-11-13): «Descargar PDF» abre la impresión del navegador con «Guardar como PDF».
// El reporte se arma en #rep (fuera de #view); al imprimir solo existe #rep. Solo lectura: todo se trabaja en la app.
const REP={};   // REP[kind] = d => ({tipo, titulo, meta:[[etiqueta, valor]], body})
const repEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,' ');
function repKpis(L){return `<div class="rkpis">${L.map(([l,v,s,c])=>`<div><span>${l}</span><b style="${c?'color:'+c:''}">${v}</b>${s?`<small>${s}</small>`:''}</div>`).join('')}</div>`;}
// n = nombre de la barra: casi siempre dato del usuario (operador, máquina); si es texto de la app, quien llama lo pasa con trData
function repBars(L,col){const mx=Math.max(...L.map(x=>x[1]),1e-9);return `<div class="rbars">${L.map(([n,v,t,c])=>`<div><span>${ud(n)}</span><i><em style="width:${(v/mx*100).toFixed(1)}%;background:${c||col}"></em></i><b>${t}</b></div>`).join('')}</div>`;}
function repDoc(kind,d){const R=REP[kind](d);const hoy=new Date().toLocaleString(LOC(),{dateStyle:'medium',timeStyle:'short'});
  return {R,css:`@page rep{size:letter portrait;margin:13mm 12mm 15mm;@bottom-left{content:"Takt · ${repEsc(R.tipo)} · ${repEsc(R.titulo)}";font:9px 'Inter',sans-serif;color:#5B6673}@bottom-right{content:"${trOn()?'Page ':'Página '}" counter(page) "${trOn()?' of ':' de '}" counter(pages);font:9px 'Inter',sans-serif;color:#5B6673}}`,
    html:`<header class="rhead"><div class="rbrand"><span>TAKT</span><small>Reporte · ${esc(R.tipo)}</small></div><h1>${ud(R.titulo)}</h1>
      <dl class="rmeta">${R.meta.map(([k,v])=>`<div><dt>${k}</dt><dd>${ud(v||'—')}</dd></div>`).join('')}</dl><p class="rgen">Generado el ${esc(hoy)} · solo lectura: los datos se trabajan en la app</p></header>${R.body}`};}
let REP_FIRED=false;
window.addEventListener('afterprint',()=>{REP_FIRED=true;repClose();});
function repBuild(kind,d){repClose();const {R,css,html}=repDoc(kind,d);
  const st=document.createElement('style');st.id='repstyle';st.textContent=css;document.head.appendChild(st);
  const el=document.createElement('div');el.id='rep';el.className='rep';el.innerHTML=html;document.body.appendChild(el);document.body.classList.add('rep-on');
  document.title=R.tipo+' · '+R.titulo;return el;}
function repClose(){const a=document.getElementById('rep'),b=document.getElementById('repstyle');if(a)a.remove();if(b)b.remove();document.body.classList.remove('rep-on');document.title=REP_TITLE;}
const REP_TITLE=document.title;
function repPrint(kind,d){repBuild(kind,d);REP_FIRED=false;try{window.print();}catch(_){}
  // si la impresión está bloqueada (enlace de prueba) no hay «afterprint»: se avisa y se quita el reporte
  setTimeout(()=>{if(!REP_FIRED){repClose();ask('Descargar PDF','Si no se abrió la ventana de impresión: en el enlace de prueba está bloqueada; en la app publicada se abre con «Guardar como PDF».','Entendido',()=>{},{ok:true,icon:'print',solo:true});}},700);}
const pdfBig=k=>`<button class="btn ghost" type="button" data-pdf="${k}|cur">${svg('pdf',18,2)} Descargar PDF</button>`;
const pdfBtn=(kind,id,name)=>`<button type="button" class="iconbtn rpdf" data-pdf="${kind}|${id}" aria-label="Descargar PDF de ${esc(name)}" title="Descargar PDF">${svg('pdf',18,2)}</button>`;
function repFind(kind,id){if(id==='cur')return ({ws:S.draft,ds:DS.d,we:DS.d,st:ST.d,mm:MM.d,sm:SM.d,tk:TK.d,hs:HS.d,pc:PC.d,at:AT.d,df:DF.d,sp:SP.d})[kind]||null;const box=storeBox(kind);return box&&box.studies.find(x=>x.id==id);}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-pdf]');if(!b)return;e.stopPropagation();
  const [k,id]=b.dataset.pdf.split('|');const d=repFind(k,id);if(d&&REP[k])repPrint(k,d);},true);
window.TaktRep={build:(k,id)=>{const d=repFind(k,id);return d?!!repBuild(k,d):false;},print:(k,id)=>{const d=repFind(k,id);if(d)repPrint(k,d);},preview:(k,d)=>!!repBuild(k,d),close:repClose,kinds:()=>Object.keys(REP),
  data:k=>{const d=repFind(k,'cur');return d?JSON.parse(JSON.stringify(d)):null;}};   // data: solo para tools/semilla.py

// ---- Work Sampling ----
REP.ws=d=>{const ops=d.ops.filter(o=>calcOp(o).sum>0);const L=calcLine(ops);const pal=palette(L.acts);
  const tg=(parseFloat(d.margen)||5)/100;const P=precisionWS(L.total.innec,L.total.sum,d.conf,tg);
  const txt=c=>LIGHT.has(c)?'#1B2430':'#fff';
  const stack=x=>`<div class="rstack">${L.acts.filter(a=>x.pct[a.id]>0).map(a=>`<em style="width:${(x.pct[a.id]*100).toFixed(2)}%;background:${pal[a.id]};color:${txt(pal[a.id])}">${x.pct[a.id]>=0.06?pc(x.pct[a.id]):''}</em>`).join('')}</div>`;
  const chunk=(A,n)=>A.reduce((r,x,i)=>(i%n?r[r.length-1].push(x):r.push([x]),r),[]);
  const cols=ops.length>1?[...L.rows,L.total]:L.rows;   // con un operador, el total repetiría lo mismo
  const tables=chunk(cols,6).map(C=>`<table class="rtbl"><thead><tr><th style="text-align:left">Actividad</th><th>Tipo</th>${C.map(x=>`<th>${ud(x.name)}</th>`).join('')}</tr></thead><tbody>
    ${L.acts.map(a=>`<tr><th>${ud(a.name)}</th><td class="${a.nec?'rnec':'rinn'}">${a.nec?'Nec.':'Innec.'}</td>${C.map(x=>`<td class="${x.id==='total'?'rtot':''}">${x.sum?pc(x.pct[a.id],1):'—'}</td>`).join('')}</tr>`).join('')}
    <tr class="rsum"><th>Innecesario</th><td></td>${C.map(x=>`<td class="rinn">${pc(x.innec,1)}</td>`).join('')}</tr>
    <tr class="rsum"><th>Necesario</th><td></td>${C.map(x=>`<td class="rnec">${pc(x.nec,1)}</td>`).join('')}</tr>
    <tr><th>Observaciones</th><td></td>${C.map(x=>`<td>${x.sum}</td>`).join('')}</tr></tbody></table>`).join('');
  const opCard=o=>{const x=calcOp(o);const opp=o.acts.filter(a=>!a.nec&&x.pct[a.id]>0).sort((a,b)=>x.pct[b.id]-x.pct[a.id]).slice(0,4);
    return `<div class="rcard"><div class="rch"><b>${ud(o.name)}</b><span>${x.sum} obs. · ${fmtT(o.start)}–${fmtT(o.end)}</span></div>
      <div class="rnums"><span class="rinn">Innecesario <b>${pc(x.innec,1)}</b></span><span class="rnec">Necesario <b>${pc(x.nec,1)}</b></span></div>
      ${opp.length?`<small>Mayor oportunidad:</small><ol>${opp.map(a=>`<li>${ud(a.name)} <b>${pc(x.pct[a.id],1)}</b></li>`).join('')}</ol>`:'<small>Sin actividades innecesarias registradas.</small>'}</div>`;};
  const body=!ops.length?'<p class="rnote">Este estudio todavía no tiene observaciones.</p>':`
    <section><h2>Resumen de la línea</h2>${repKpis([['Necesario',pc(L.total.nec,1),'aporta valor','#1D5FA8'],['Innecesario',pc(L.total.innec,1),'oportunidad de mejora','#C2410C'],['Observaciones',String(L.total.sum),ops.length+' operador'+(ops.length!==1?'es':'')],['Precisión',P.e!=null?'±'+(P.e*100).toFixed(1)+'%':'—',d.conf+'% confianza · '+(P.ok?'cumple ±'+d.margen+'%':'faltan '+P.falta+' obs. para ±'+d.margen+'%'),P.ok?'#1D5FA8':'']])}</section>
    ${ops.length>1?`<section><h2>¿Quién pesa más en lo innecesario?</h2>${repBars([...L.rows].sort((a,b)=>b.innec-a.innec).map(x=>[x.name,x.innec,pc(x.innec,1)]),'#C2410C')}</section>`:''}
    <section><h2>Distribución de actividades</h2><div class="rstacks">${cols.map(x=>`<div class="${x.id==='total'?'rtotrow':''}"><span>${ud(x.name)}<small>${x.sum} obs.</small></span>${stack(x)}</div>`).join('')}</div>
      <div class="rlegend">${L.acts.map(a=>`<span><i style="background:${pal[a.id]}"></i>${ud(a.name)}</span>`).join('')}</div></section>
    <section class="${L.acts.length>22||cols.length>6?'rlong':''}"><h2>Resultado por actividad (%)</h2>${tables}</section>
    <section class="${ops.length>6?'rlong':''}"><h2>Detalle por operador</h2><div class="rcards">${ops.map(opCard).join('')}</div></section>`;
  return {tipo:'Work Sampling',titulo:d.titulo||'Work Sampling',meta:[['Ubicación',ubLabel(d)],['Área',d.area],['No. de parte',d.parte],['Analista',d.analista],['Fecha',d.fecha],['Confianza / margen',d.conf+'% · ±'+d.margen+'%']],body};};


// Yamazumi fijo para papel: columnas con segmentos apilados y la línea del límite (disponible / takt)
function repYama(cols,lim,limLbl,per,fix){per=per||10;const ymax=fix||Math.max(lim*1.15,...cols.map(c=>c.total*1.08),1e-9);const H=170;
  // renglones de máximo 10 barras, todos con la MISMA escala y la misma línea del límite: se comparan entre renglones
  const rows=[];for(let k=0;k<cols.length;k+=per)rows.push(cols.slice(k,k+per));
  return rows.map((R,ri)=>{const pad=per-R.length;const fill=rows.length>1&&pad>0?Array.from({length:pad},()=>'<div class="rycol"></div>').join(''):'';const fillN=rows.length>1&&pad>0?Array.from({length:pad},()=>'<div></div>').join(''):'';
    return `<div class="ryama"><div class="ryhead"><small>${rows.length>1?`${ri*per+1}–${ri*per+R.length} de ${cols.length}`:''}</small><small class="rylbl">— ${limLbl}</small></div><div class="ryplot" style="height:${H}px"><div class="rylim" style="bottom:${(lim/ymax*H).toFixed(1)}px"></div>
    ${R.map(c=>`<div class="rycol"><div class="rybar">${c.segs.filter(g=>g.v>0).map(g=>`<em style="height:${(g.v/ymax*H).toFixed(1)}px;background:${c.over?'#E8A584':g.c}"></em>`).join('')}<b class="${c.over?'rinn':''}">${c.top}</b></div></div>`).join('')}${fill}</div>
    <div class="rynames">${R.map(c=>`<div><span>${ud(c.name)}</span><small class="${c.over?'rinn':''}">${c.sub}</small></div>`).join('')}${fillN}</div></div>`;}).join('');}

// ---- Delay Study y Work Element: comparten carga, Yamazumi y detalle por operador ----
function repCarga(d){const r=dsCalc(d.acts,d.ops,d.assign,d.obj,d.disp,null);const pal=dsPal(d.acts);const over=r.rows.filter(x=>x.occ>1).length;const per=perLbl(d);
  const nm=a=>dsName(a,d.acts.indexOf(a));const used=d.acts.filter(a=>d.ops.some(o=>o.id===d.assign[a.id]));const many=d.ops.length>8||d.acts.length>14;
  const yama=repYama(r.rows.map(x=>({name:x.name,total:x.load,over:x.occ>1,top:pc(x.occ),sub:(x.free<0?'excede '+f2(-x.free):'libre '+f2(x.free))+' min',
    segs:x.items.map(it=>({v:it.load,c:pal[it.id]}))})),r.disp,d.periodo==='ciclo'?'tiempo ciclo '+f2(r.disp)+' min':f2(r.disp)+' min disponibles por '+per);
  const det=r.rows.map(x=>x.items.map((it,k)=>{const a=d.acts.find(z=>z.id===it.id);return `<tr>${k===0?`<th rowspan="${x.items.length+1}">${ud(x.name)}<small>obj ${f2(x.obj).replace(/\.00$/,'')} pzs/${per}</small></th>`:''}<td style="text-align:left">${ud(nm(a))}</td><td>${ud(a.material||'—')}</td><td>${f2(it.pp)}</td><td>${f2(it.load)}</td><td>${pc(r.disp?it.load/r.disp:0,1)}</td></tr>`;}).join('')
    +`<tr class="rsum">${x.items.length?'':`<th>${ud(x.name)}</th>`}<td style="text-align:left">Total</td><td></td><td></td><td>${f2(x.load)}</td><td class="${x.occ>1?'rinn':'rnec'}">${pc(x.occ,1)}</td></tr>`).join('');
  return {r,many,html:`<section><h2>Resumen</h2>${repKpis([['Ocupación promedio',pc(r.avgOcc,1),d.ops.length+' operador'+(d.ops.length!==1?'es':''),'#1D5FA8'],['Personal requerido teórico',r.needed.toFixed(2),'carga total ÷ tiempo disponible'],['Operadores arriba de 100 %',String(over),over?'hay que rebalancear':'todos dentro del tiempo',over?'#C2410C':'#1D5FA8'],['Carga total',f2(r.total),'min por '+per]])}</section>
    <section class="${d.ops.length>10?'rlong':''}"><h2>Carga por operador (Yamazumi)</h2>${yama}${(()=>{const seen=new Map();used.forEach(a=>{const k=String(nm(a)).trim().toUpperCase();if(!seen.has(k))seen.set(k,a);});const U=[...seen.values()];
      return U.length>24?`<p class="rnote" style="font-size:9.5px">${U.length} ${isWE(d)?'elementos':'actividades'} distintos: cada color es uno; el detalle está en la tabla siguiente.</p>`:`<div class="rlegend">${U.map(a=>`<span><i style="background:${pal[a.id]}"></i>${ud(nm(a))}</span>`).join('')}</div>`;})()}</section>
    <section class="${many?'rlong':''}"><h2>Detalle por operador</h2><table class="rtbl"><thead><tr><th style="text-align:left">Operador</th><th style="text-align:left">${isWE(d)?'Elemento':'Actividad'}</th><th>Material</th><th>Min/pza</th><th>Carga (min)</th><th>% del disponible</th></tr></thead><tbody>${det}</tbody></table></section>`};}
const repMetaDS=(d,obs)=>[['Ubicación',ubLabel(d)],['Área',d.area],['No. de parte',d.parte],[obs,d.observador],['Fecha',d.fecha],[isWE(d)&&d.periodo==='ciclo'?'Base':'Periodo / objetivo',isWE(d)&&d.periodo==='ciclo'?'tiempo ciclo de la línea':f2(num(d.disp)).replace(/\.00$/,'')+' min por '+perLbl(d)+(String(d.obj||'').trim()?' · '+d.obj+' pzs':'')]];

// ---- Delay Study ----
REP.ds=d=>{const C=repCarga(d);const nm=a=>dsName(a,d.acts.indexOf(a));const opName=id=>{const o=d.ops.find(x=>x.id===id);return o?o.name:'Sin asignar';};
  const acts=d.acts.map((a,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${ud(nm(a))}</td><td>${ud(a.material||'—')}</td><td>${dsPz(a)>0?num(a.racks)+' × '+num(a.snp)+' = '+dsPz(a):'vuelta vacía'}</td><td>${f2((a.secs||0)/60)}</td><td>${f2(dsPerPiece(a,d.acts))}</td><td>${ud(opName(d.assign[a.id]))}</td></tr>`).join('');
  const body=!d.acts.length?'<p class="rnote">Este estudio todavía no tiene actividades cronometradas.</p>':C.html+`
    <section class="${C.many?'rlong':''}"><h2>Actividades cronometradas</h2><p class="rnote" style="font-size:9.5px;margin:0 0 6px">Las vueltas vacías no traen piezas, pero su tiempo cuenta: se reparte entre las piezas del traslado al que pertenecen.</p><table class="rtbl"><thead><tr><th>#</th><th style="text-align:left">Actividad</th><th>Material</th><th>Piezas (racks × SNP)</th><th>Tiempo (min)</th><th>Min/pza</th><th>Operador</th></tr></thead><tbody>${acts}</tbody></table></section>`;
  return {tipo:'Delay Study',titulo:d.titulo||'Delay Study',meta:repMetaDS(d,'Observador'),body};};

// ---- Work Element ----
REP.we=d=>{const C=repCarga(d);const n=weN(d);const opName=id=>{const o=d.ops.find(x=>x.id===id);return o?o.name:'Sin asignar';};
  const vals=e=>(e.times||[]).slice(0,n).filter(t=>t!==''&&t!=null&&!isNaN(parseFloat(String(t).replace(',','.')))).map(num);
  const crono=d.ops.map(op=>{const els=dsSeq(d,op.id);if(!els.length)return '';const tot=els.reduce((s,e)=>s+weAvg(e.times),0);
    return `<div class="rblock"><div class="rch"><b>${ud(op.name)}</b><span>${weComplete(els,n)} de ${n} ciclos completos · ciclo promedio ${f2(tot)} min</span></div>
    <table class="rtbl"><thead><tr><th>#</th><th style="text-align:left">Elemento</th><th>Ciclos</th><th>Promedio (min)</th><th>Mín</th><th>Máx</th><th>Rango</th><th>Asignado a</th></tr></thead><tbody>
    ${els.map((e,i)=>{const v=vals(e);const mn=v.length?Math.min(...v):0,mx=v.length?Math.max(...v):0;return `<tr><td>${i+1}</td><td style="text-align:left">${ud(e.name)}</td><td>${v.length}</td><td><b>${f2(weAvg(e.times))}</b></td><td>${v.length?f2(mn):'—'}</td><td>${v.length?f2(mx):'—'}</td><td>${v.length?f2(mx-mn):'—'}</td><td>${ud(opName(d.assign[e.id]))}</td></tr>`;}).join('')}
    <tr class="rsum"><td></td><td style="text-align:left">Total del ciclo</td><td></td><td>${f2(tot)}</td><td></td><td></td><td></td><td></td></tr></tbody></table></div>`;}).join('');
  const body=!d.acts.length?'<p class="rnote">Este estudio todavía no tiene elementos cronometrados.</p>':C.html+`<section class="rlong"><h2>Cronometraje por operador</h2><p class="rnote" style="font-size:9.5px;margin:0 0 6px">Promedio = media de los ciclos capturados de cada elemento (las celdas vacías no cuentan). Rango = máximo − mínimo.</p>${crono}</section>`;
  return {tipo:'Work Element',titulo:d.titulo||'Work Element',meta:repMetaDS(d,'Analista'),body};};

// ---- utilidades para los reportes que reusan las gráficas SVG de la app ----
// Toma la gráfica (<svg role="img">) de una tarjeta de la app, sin animación y con ids propios (los marcadores no chocan con la app)
function repSvg(html,cls){const m=String(html||'').match(/<svg[^>]*role="img"[\s\S]*?<\/svg>/);if(!m)return '';
  const s=m[0].replace(/id="([^"]+)"/g,'id="rp-$1"').replace(/url\(#([^)]+)\)/g,'url(#rp-$1)');
  return `<div class="stchart parchart rsvg ${cls||''}">${s}</div>`;}
const repLeg=L=>`<div class="rlegend">${L.map(([n,c,line])=>`<span><i style="${line?`background:transparent;border-top:2px ${line} ${c};height:0;border-radius:0;vertical-align:3px`:'background:'+c}"></i>${esc(n)}</span>`).join('')}</div>`;
const repProj=(rows,cols)=>`<table class="rtbl"><thead><tr><th style="text-align:left"></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(([l,v,col])=>`<tr><th>${l}</th>${v.map(x=>`<td style="${col?'color:'+col+';':''}font-weight:600">${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
// leyenda de elementos agrupada por nombre (con más de 24 distintos se omite: el detalle está en la tabla)
function repLegNames(items,nameOf,colOf,what){const seen=new Map();items.forEach(a=>{const k=String(nameOf(a)).trim().toUpperCase();if(!seen.has(k))seen.set(k,a);});const U=[...seen.values()];
  return U.length>24?`<p class="rnote" style="font-size:9.5px">${U.length} ${what} distintos: cada color es uno; el detalle está en la tabla siguiente.</p>`:repLeg(U.map(a=>[nameOf(a),colOf(a)]));}
const repNo=(t)=>`<p class="rnote">${t}</p>`;
// algunas gráficas de la app marcan lo seleccionado en pantalla: en el reporte va limpio
function repClean(st,keys,fn){const old={};keys.forEach(k=>{old[k]=st[k];st[k]=null;});try{return fn();}finally{keys.forEach(k=>st[k]=old[k]);}}

// ---- Speed Trial ----
REP.st=d=>{const r=stC(d);const To=num(d.tcobj);const plan=d.oeePlan??85;const meta=[['Ubicación',ubLabel(d)],['No. de parte',d.parte],['Proceso / modelo',[d.proceso,d.modelo].filter(Boolean).join(' · ')],['Analista',d.analista],['Periodo',d.periodo],['TC objetivo',To?f2(To)+' min':'']];
  if(!r.N)return {tipo:'Speed Trial',titulo:stName(d),meta,body:repNo('Este estudio todavía no tiene piezas registradas.')};
  const o=stOEE(r);const k=stLineStats(r,d.tcobj,plan);const K=stCost(r.jphReal,d.tcobj,plan,moneyNum(d.costo),d.hd??22.5,d.dw??6,d.wm??4);const P=stPareto(d.recs,d.tcobj,stCat(d));
  const goal=num(plan)/100;const okOEE=o.oee>=goal;const D=o.disp||1;
  const lvl=(l,v,cls)=>`<tr class="${cls||''}"><th>${l}</th><td>${f2(v)}</td><td>${pc(v/D,1)}</td></tr>`;
  const lossRows=ks=>ks.filter(x=>Math.abs(x[1])>1e-9).map(([l,v])=>`<tr><td style="text-align:left;padding-left:18px">${esc(l)}</td><td>${f2(v)}</td><td>${pc(v/D,1)}</td></tr>`).join('');
  const L=(ks)=>ks.map(c=>[c+'. '+ST_CAUSES[+c-1],r.loss[c]||0]);
  const oeeTbl=`<table class="rtbl"><thead><tr><th style="text-align:left">Nivel / pérdida</th><th>Minutos</th><th>% del disponible</th></tr></thead><tbody>
    ${lvl('Tiempo disponible (registrado + paro planeado)',o.disp,'rsum')}${lossRows([['Paro planeado',o.paro]])}
    ${lvl('Tiempo laborable',o.lab,'rsum')}${lossRows(L(ST_AV))}
    ${lvl('Tiempo trabajado · disponibilidad '+pc(o.A,1),o.trab,'rsum')}${lossRows(L(ST_SP).concat(r.gain<0?[['Ganancia: piezas más rápidas que el objetivo',r.gain]]:[]))}
    ${lvl('Tiempo neto (piezas NG + OK) · desempeño '+pc(o.P,1),o.neto,'rsum')}${lossRows(L(ST_Q))}
    ${lvl('Tiempo de piezas OK · calidad '+pc(o.Q,1),o.ok,'rsum')}</tbody></table>`;
  const stats=[['Capacidad','JPH objetivo (100 % OEE)',k.jph100,'60 ÷ TC objetivo'],['Capacidad','JPH plan (OEE '+plan+' %)',k.jphPlan,'(60 ÷ TC objetivo) × OEE plan'],['Capacidad','Piezas posibles en el tiempo registrado',k.possible,'tiempo total ÷ TC objetivo'],
    ['Real','JPH real (piezas OK)',k.jphReal,'piezas OK ÷ horas registradas'],['Real','JPH máximo (pieza más rápida)',k.jphMax,'60 ÷ T.T mínimo'],['Real','JPH mínimo (pieza más lenta)',k.jphMin,'60 ÷ T.T máximo'],
    ['Pérdida','Minutos de pérdida por afectaciones',k.lossMin,'causas 1 a 14'],['Pérdida','Piezas perdidas por afectaciones',k.lostPz,'minutos de pérdida ÷ TC objetivo'],['Pérdida','JPH perdido',k.jphLost,'piezas perdidas ÷ horas registradas'],
    ['Afectación','JPH con afectación (WA)',k.jphTT,'60 ÷ promedio T.T WA'],['Afectación','JPH sin afectación (WOA)',k.jphWOA,'60 ÷ promedio T.T WOA'],['Afectación','Promedio T.T con afectación (WA)',k.promTT,'tiempo ÷ muestras'],['Afectación','Promedio T.T sin afectación (WOA)',k.promWA,'(tiempo − pérdidas) ÷ muestras']];
  const loss=K.gap>0;const cs=v=>(loss?'':'+')+money(Math.abs(v));
  const recs=d.recs.filter(x=>num(x.t)>0);
  const body=`<section><h2>Resumen</h2>${repKpis([['OEE',pc(r.oee,1),(okOEE?'cumple':'no cumple')+' el objetivo de '+plan+' %',okOEE?'#1D5FA8':'#C2410C'],['JPH real',f2(r.jphReal),'plan '+f2(k.jphPlan)+' · 100 % = '+f2(k.jph100)],['TC real (promedio)',f2(r.tcReal),'objetivo '+f2(To)+' min · '+r.N+' piezas'],['Piezas OK / NG',r.ok+' / '+r.def,f2(r.T)+' min registrados',r.def?'#C2410C':'']])}</section>
    <section><h2>Fluctuación de la línea, pieza por pieza</h2>${repSvg(stLine(d,r))}${repLeg([['Arriba del objetivo','#DC2626'],['En o abajo del objetivo','#15803D'],['TC objetivo '+f2(To),'#1B2430','dashed'],['TC real '+f2(r.tcReal),'#1D5FA8','dotted']])}<p class="rnote" style="font-size:9.5px">Los puntos con borde oscuro tienen una falla registrada. ${recs.filter(x=>num(x.t)>To).length} de ${recs.length} piezas por encima del objetivo.</p></section>
    <section><h2>Pérdidas acorde a la OEE</h2>${repKpis([['Disponibilidad',pc(o.A,1),'trabajado ÷ laborable'],['Desempeño',pc(o.P,1),'neto ÷ trabajado'],['Calidad',pc(o.Q,1),'piezas OK ÷ (NG + OK)'],['OEE',pc(o.oee,1),'A × D × C · objetivo '+plan+' %',okOEE?'#1D5FA8':'#C2410C']])}<div style="height:8px"></div>${oeeTbl}</section>
    <section><h2>Estadísticas de la línea</h2><table class="rtbl"><thead><tr><th style="text-align:left">Grupo</th><th style="text-align:left">Indicador</th><th>Valor</th><th style="text-align:left">Cómo se calcula</th></tr></thead><tbody>${stats.map(x=>`<tr><td style="text-align:left;color:#5B6673">${x[0]}</td><th>${x[1]}</th><td><b>${f2(x[2])}</b></td><td style="text-align:left;color:#5B6673">${x[3]}</td></tr>`).join('')}</tbody></table><p class="rnote" style="font-size:9.5px">WA = con afectación · WOA = sin afectación.</p></section>
    ${moneyNum(d.costo)?`<section><h2>${loss?'Proyección del costo por incumplimiento de JPH':'Proyección de la ventaja contra el JPH plan'}</h2>${repKpis([['GAP de JPH',(loss?'−':'+')+f2(Math.abs(K.gap)),'plan '+f2(K.jphPlan)+' · real '+f2(K.jphReal),loss?'#C2410C':'#1D5FA8'],['Por hora',cs(K.hour),'GAP × costo unitario '+money(moneyNum(d.costo))],['Mensual',cs(K.month),'',loss?'#C2410C':'#1D5FA8'],['Anual',cs(K.year),'12 meses',loss?'#C2410C':'#1D5FA8']])}
      <div style="height:6px"></div>${repProj([['Proyección',[K.hour,K.day,K.week,K.month,K.year].map(cs),loss?'#C2410C':'#1D5FA8']],['Hora','Día','Semana','Mes','Año'])}<p class="rnote" style="font-size:9.5px">Supone el mismo GAP todas las horas: ${esc(d.hd??22.5)} h/día · ${esc(d.dw??6)} días/semana · ${esc(d.wm??4)} semanas/mes · 12 meses.</p></section>`:''}
    ${P.items.length?`<section><h2>Pareto de afectaciones</h2><p class="rnote" style="font-size:9.5px;margin:0 0 4px">Solo piezas que excedieron el TC objetivo (o defectivas) · ${f2(P.total)} min = ${f2(P.lostPz)} piezas perdidas. Renglones en negritas: los pocos vitales (hasta el 80 %).</p>${repSvg(stParetoCard(d,r))}${repLeg([['Minutos perdidos','#3E7BC4'],['% acumulado','#DC2626'],['80 %','#1B2430','dashed']])}
      <table class="rtbl"><thead><tr><th>#</th><th style="text-align:left">Afectación</th><th>6M</th><th>Veces</th><th>Min</th><th>%</th><th>Acumulado</th><th>Piezas perdidas</th></tr></thead><tbody>
      ${P.items.map(x=>`<tr style="${x.acc-x.pct<0.8?'font-weight:700':''}"><td>${x.pos}</td><td style="text-align:left">${esc(x.label)}${x.otros?` (${x.otros} problemas)`:''}</td><td>${esc(x.m6||'—')}</td><td>${x.rep}</td><td>${f2(x.min)}</td><td>${pc(x.pct,1)}</td><td class="rinn">${pc(x.acc,1)}</td><td>${f2(x.lostPz)}</td></tr>`).join('')}
      <tr class="rsum"><td></td><td style="text-align:left">Total</td><td></td><td>${P.items.reduce((s,x)=>s+x.rep,0)}</td><td>${f2(P.total)}</td><td>100 %</td><td></td><td>${f2(P.lostPz)}</td></tr></tbody></table></section>`:''}
    ${stCascade(d.recs,d.tcobj,stCat(d))?`<section><h2>Caída de JPH</h2><p class="rnote" style="font-size:9.5px;margin:0 0 4px">Del JPH al 100 % al JPH real: cada barra roja es una posición del Pareto; la verde, lo que se ganó con piezas más rápidas que el objetivo.</p>${repSvg(stCascCard(d,r),'casc')}${repLeg([['Pérdida','#DC2626'],['Ganancia','#15803D'],['JPH plan '+f2(k.jphPlan),'#C2410C','dashed']])}</section>`:''}
    <section class="rlong"><h2>Anexo · registro pieza por pieza</h2><table class="rtbl rsm"><thead><tr><th>No.</th><th>Tiempo (min)</th><th>GAP vs TC</th><th style="text-align:left">Pérdida</th><th style="text-align:left">Estación · problema</th><th>6M</th><th style="text-align:left">Comentario</th><th>Resultado</th></tr></thead><tbody>
      ${recs.map((x,i)=>{const t=num(x.t),g=t-To;const p=stProb(d,x.probId);return `<tr><td>${i+1}</td><td>${f2(t)}</td><td class="${g>0?'rinn':'rnec'}">${g>0?'+':''}${f2(g)}</td><td style="text-align:left">${x.cause?esc(causeLbl(x.cause)):'—'}</td><td style="text-align:left">${p?ud(probLbl(p)):'—'}</td><td>${esc((p||{}).m6||'—')}</td><td style="text-align:left">${ud(x.prob||'')}</td><td>${stIsDef(x.cause)?'<b class="rinn">NG</b>':'OK'}</td></tr>`;}).join('')}</tbody></table></section>`;
  return {tipo:'Speed Trial',titulo:stName(d),meta,body};};

// ---- Man Machine Chart ----
REP.mm=d=>{const meta=[['Ubicación',ubLabel(d)],['Línea / celda',d.linea],['No. de parte',d.parte],['Analista',d.analista],['Fecha',d.fecha],['TC objetivo',num(d.tcobj)?fT(num(d.tcobj))+' min':'']];
  if(!d.sts.length)return {tipo:'Man Machine Chart',titulo:mmName(d),meta,body:repNo('Este estudio todavía no tiene estaciones.')};
  const T=mmTable(d.sts,d.mpp);const G=mmChart(T.rows);const lim=G.lim;const K=mmKpis(G,T.rows,d);const lose=K.gap>1e-9;
  const sup=`${esc(d.hd)} h/día · ${esc(d.dw)} días/semana · ${esc(d.wm)} semanas/mes`;const n1=v=>v.toLocaleString(LOC(),{maximumFractionDigits:1});
  const verdict=lim?`La celda la limita <b>${ud(lim.name)}</b>: necesita ${fT(lim.need)} min por vuelta (${fT(lim.man)} manual + ${fT(lim.tc)} de máquina) y el operador regresa en ${fT(G.top)}. El operador espera <b>${fT(G.wait)} min por vuelta</b> (${pc(G.wait/G.C)} de su tiempo).`
    :`La celda la limita <b>el operador</b>: su vuelta (${fT(G.top)} min) es más larga que lo que necesita cualquier máquina, así que no espera; son las máquinas las que lo esperan a él.`;
  const body=`<section><h2>Resumen</h2>${repKpis([['Ciclo del operador',fT(G.top),'manual '+fT(G.manT)+' + durante '+fT(G.durT)+' + caminata '+fT(G.walkT)],['Ciclo real de la celda',fT(G.C),'lo limita '+(lim?lim.name:'el operador')+' · '+f2(G.jph)+' pzs/h','#1D5FA8'],['Espera del operador',fT(G.wait),'por vuelta · ocupación '+pc(G.occ),G.wait>1e-6?'#C2410C':''],['Recorrido',f2(T.metros)+' m',T.pasos+' pasos por vuelta']])}<p style="margin:8px 0 0;font-size:11px">${verdict}</p></section>
    <section><h2>Gráfica hombre-máquina</h2>${repSvg(mmChartSvg(d,G))}${repLeg([['Operación manual','#1B2430'],['Ciclo de máquina','#1D5FA8','dashed'],['Caminata (pasos × 0.01 min)','#8A96A3','solid']])}</section>
    <section><h2>Tiempos por estación en la vuelta</h2><table class="rtbl"><thead><tr><th>Proceso</th><th style="text-align:left">Estación</th><th>Tipo</th><th>TC máquina</th><th>Manual</th><th>Durante el ciclo</th><th>Pasos</th><th>Llega</th><th>Máquina libre</th><th>Necesita por vuelta</th><th>Ocio</th><th>Utilización</th></tr></thead><tbody>
      ${G.rows.map((x,i)=>{const t=T.rows[i];return `<tr style="${lim&&x===lim?'font-weight:700':''}"><td>${i+1}</td><td style="text-align:left">${ud(x.name)}${t.n>1?' ×'+t.n:''}</td><td>${mmKindLbl[t.s.kind]}</td><td>${x.maq?fT(x.tc):'—'}</td><td>${fT(x.man)}</td><td>${x.dur?fT(x.dur):'—'}</td><td>${t.pasos}</td><td>${fT(x.arr)}</td><td>${x.maq?fT(x.mEnd):'—'}</td><td>${x.maq?fT(x.need):'—'}</td><td>${x.maq?fT(x.idle):'—'}</td><td>${x.maq?pc(x.util):'—'}</td></tr>`;}).join('')}
      <tr class="rsum"><td></td><td style="text-align:left">Vuelta del operador</td><td></td><td></td><td>${fT(G.manT)}</td><td>${fT(G.durT)}</td><td>${T.pasos}</td><td colspan="5" style="text-align:left">ciclo ${fT(G.top)} min · celda ${fT(G.C)} min</td></tr></tbody></table>
      ${G.rows.some(x=>x.durOver)?`<p class="rnote rinn" style="font-size:9.5px">Ojo: en ${G.rows.filter(x=>x.durOver).map(x=>ud(x.name)).join(', ')} la operación manual «durante el ciclo» dura más que el TC de la máquina.</p>`:''}</section>
    ${K.To?`<section><h2>Indicadores contra el TC objetivo</h2>${repKpis([['JPH real vs plan',f2(K.jphReal),'plan '+f2(K.jphPlan)+' (OEE '+f2(K.oee*100).replace('.00','')+' %) · 100 % = '+f2(K.jph100)],[lose?'Piezas perdidas por hora':'Piezas arriba del plan',(lose?'−':'+')+f2(Math.abs(K.gap)),lose?'la celda sale más lenta que el plan':'la celda alcanza el plan',lose?'#C2410C':'#15803D'],['Operador sin trabajo',pc(K.waitFrac,1),f2(K.waitFrac*60)+' min de cada hora',K.waitFrac>1e-6?'#C2410C':''],['Ocupación de máquinas',pc(K.occAvg,1),'TC promedio '+fT(K.tcAvg)+' ÷ '+fT(K.To)+(K.over.length?' · '+K.over.length+' arriba del objetivo':''),'#1D5FA8']])}
      ${lose||K.waitFrac>1e-6?`<div style="height:8px"></div>${repProj([].concat(lose?[['Piezas perdidas',[K.pz.hour,K.pz.day,K.pz.week,K.pz.month,K.pz.year].map(n1),'#C2410C']]:[],K.waitFrac>1e-6?[['Horas-hombre sin trabajo',[K.hh.hour,K.hh.day,K.hh.week,K.hh.month,K.hh.year].map(v=>n1(v)+' h'),'#C2410C']]:[]),['Hora','Día','Semana','Mes','Año'])}<p class="rnote" style="font-size:9.5px">Proyección con ${sup}.</p>`:''}
      ${K.maqs.length?`<div class="rblock"><h3 style="font-size:11px;margin:8px 0 2px">Ocupación de máquinas contra el TC objetivo</h3>${repSvg(mmOccSvg(K))}${repLeg([['Dentro del objetivo','#3E7BC4'],['Arriba del objetivo','#DC2626'],['Objetivo','#C2410C','dashed'],['Promedio','#1B2430','dotted']])}</div>`:''}</section>`:''}
    <section><h2>Layout del recorrido</h2>${repClean(MM,['sel','addAt'],()=>repSvg(mmLayoutSvg(d,true),'rbox'))}<p class="rnote" style="font-size:9.5px">Los números en las flechas son los pasos entre estaciones; el número de cada caja es su orden en la vuelta.</p></section>`;
  return {tipo:'Man Machine Chart',titulo:mmName(d),meta,body};};

// ---- SMED ----
REP.sm=d=>{const meta=[['Ubicación',ubLabel(d)],['Línea / máquina',d.linea],['Cambio',[d.de,d.a].every(Boolean)?d.de+' → '+d.a:''],['Personas en el cambio',d.personas],['Analista',d.analista],['Fecha',d.fecha]];
  if(!d.steps.length)return {tipo:'SMED',titulo:smName(d),meta,body:repNo('Este estudio todavía no tiene pasos registrados.')};
  const r=smCalc(d.steps,d);const hrs=v=>v.toLocaleString(LOC(),{maximumFractionDigits:1})+' h';const pz=v=>v.toLocaleString(LOC(),{maximumFractionDigits:0});
  const proj=[].concat(r.hrs?[['Horas de paro recuperadas',[fT(r.red)+' min',hrs(r.hrs.week),hrs(r.hrs.month),hrs(r.hrs.year)],'#15803D']]:[],r.pz?[['Piezas recuperadas',[f2(r.pz.cambio),pz(r.pz.week),pz(r.pz.month),pz(r.pz.year)],'#15803D']]:[]);
  const body=`<section><h2>Resumen</h2>${repKpis([['Paro actual',fT(r.actual)+' min',d.steps.length+' pasos'],['Paro propuesto',fT(r.prop)+' min','solo lo interno · externo '+fT(r.E)+' · eliminado '+fT(r.X),'#1D5FA8'],['Reducción','−'+pc(r.pct,1),fT(r.red)+' min menos por cambio','#15803D'],['Meta SMED (menos de 10 min)',r.meta?'Cumple':fT(r.prop-10)+' min',r.meta?'paro de un solo dígito':'de paro interno faltan por reducir',r.meta?'#15803D':'#C2410C']])}</section>
    <section><h2>Paro actual contra propuesto</h2>${repSvg(smBars(r),'rpad')}${repLeg([['Interno (máquina parada)','#1D5FA8'],['Externo (sale del paro)','#9DB9DA'],['Eliminado','#E8B4A0']])}</section>
    ${proj.length?`<section><h2>Lo que se recupera</h2>${repProj(proj,['Por cambio','Semana','Mes','Año'])}<p class="rnote" style="font-size:9.5px">${fT(r.red)} min × ${esc(d.cpw)} cambios por semana × ${esc(d.wm)} semanas por mes${r.pz?' · piezas = minutos ÷ TC objetivo '+fT(num(d.tcobj)):''}.</p></section>`:''}
    <section><h2>¿En qué se va el tiempo del cambio?</h2>${repSvg(smCatSvg(r),'rpad')}</section>
    <section class="${d.steps.length>25?'rlong':''}"><h2>Pasos del cambio</h2><table class="rtbl"><thead><tr><th>No.</th><th style="text-align:left">Paso</th><th style="text-align:left">Categoría</th><th>Actual (min)</th><th>Clasificación</th><th>Propuesto (min)</th></tr></thead><tbody>
      ${d.steps.map((s,i)=>{const c=smCls(s);return `<tr><td>${i+1}</td><td style="text-align:left">${ud(s.desc)}</td><td style="text-align:left">${esc(s.cat)}</td><td>${fT(num(s.t))}</td><td class="${c==='I'?'rnec':c==='X'?'rinn':''}">${SM_CLS[c][0]}</td><td>${c==='X'?'—':fT(smNew(s))+(c==='E'?' (fuera del paro)':'')}</td></tr>`;}).join('')}
      <tr class="rsum"><td></td><td style="text-align:left">Total de paro</td><td></td><td>${fT(r.actual)}</td><td></td><td>${fT(r.prop)}</td></tr></tbody></table>
      <p class="rnote" style="font-size:9.5px">Interno = necesita la máquina parada · Externo = se hace antes o después con la máquina corriendo · Eliminar = no agrega valor.</p></section>`;
  return {tipo:'SMED',titulo:smName(d),meta,body};};

// ---- Takt y balanceo ----
REP.tk=d=>{const takt=tkTakt(d),disp=tkDisp(d),dem=tkDem(d.demanda);const pz=v=>v.toLocaleString(LOC(),{maximumFractionDigits:0});
  const meta=[['Ubicación',ubLabel(d)],['Analista',d.analista],['Fecha',d.fecha],['Demanda',dem?pz(dem)+' pzs/día':''],['Turnos',d.turnos],['Takt',takt?fT(takt.toFixed(3))+' min/pza':'']];
  if(!d.estaciones.length)return {tipo:'Takt y balanceo',titulo:tkName(d),meta,body:repNo('Este balanceo todavía no tiene estaciones.')};
  const r=tkNow(d),a=tkAntes(d),mv=tkMoved(d);const pal=tkPal(d);
  const col=R=>R.rows.map(x=>({name:x.nombre,total:x.tc,over:x.over,top:fT(x.tc.toFixed(3)),sub:takt?(x.over?'excede ':'holgura ')+f2(Math.abs(takt-x.tc))+' min':'',segs:x.items.map(e=>({v:tkNum(e.t),c:pal[e.id]}))}));
  const ymax=Math.max(takt*1.15,...r.rows.map(x=>x.tc*1.08),...a.rows.map(x=>x.tc*1.08),0.1);const lbl='takt '+fT(takt.toFixed(3))+' min';
  const many=r.n>10||d.els.length>40;
  const body=`<section><h2>Takt de la línea</h2>${repKpis([['Demanda del cliente',pz(dem),'piezas por día'],['Tiempo disponible',fT(disp.toFixed(2))+' min',`${esc(d.turnos)} turno${num(d.turnos)!==1?'s':''} × (${esc(d.minTurno)} − ${esc(d.paros||'0')} de paros)`],['Takt',takt?fT(takt.toFixed(3)):'—','min por pieza = disponible ÷ demanda','#1D5FA8'],['Personal teórico',r.personal.toFixed(2),'Σ TC ÷ takt · mínimo '+r.minEst+' estaciones']])}</section>
    <section><h2>Resultado del balanceo${mv?' (con rebalanceo simulado)':''}</h2>${repKpis([['Cuello de botella',r.bott?fT(r.max.toFixed(3)):'—',r.bott?r.bott.nombre+' · '+pc(r.bott.pct)+' del takt'+(mv&&a.bott&&Math.abs(a.max-r.max)>1e-9?' · antes '+fT(a.max.toFixed(3)):''):'',r.over?'#C2410C':'#1D5FA8'],['Estaciones sobre takt',String(r.over),'de '+r.n+(mv&&a.over!==r.over?' · antes '+a.over:''),r.over?'#C2410C':'#15803D'],['Capacidad teórica',f2(r.cap)+' pzs/h',pz(r.capDia)+' pzs/día · '+(r.cumple?'cumple la demanda':'faltan '+pz(Math.max(0,dem-r.capDia))+' pzs/día'),r.cumple?'#15803D':'#C2410C'],['Eficiencia de balanceo',(mv&&Math.abs(a.eff-r.eff)>1e-9?pc(a.eff,1)+' → ':'')+pc(r.eff,1),'Σ TC '+fT(r.total.toFixed(3))+' ÷ ('+r.n+' × '+fT(r.max.toFixed(3))+')']])}</section>
    ${mv?`<section class="${many?'rlong':''}"><h2>Antes · como se trajo de los estudios</h2>${repYama(col(a),takt,lbl,10,ymax)}</section>`:''}
    <section class="${many?'rlong':''}"><h2>${mv?'Después · rebalanceo simulado':'Tiempo ciclo por estación contra el takt'}</h2>${repYama(col(r),takt,lbl,10,ymax)}${repLegNames(d.els,e=>e.name,e=>pal[e.id],'elementos')}</section>
    <section><h2>Estaciones</h2><table class="rtbl"><thead><tr><th style="text-align:left">Estación</th>${mv?'<th>TC como se trajo</th>':''}<th>TC${mv?' simulado':''} (min)</th><th>% del takt</th><th>Holgura (min)</th><th>Elementos</th></tr></thead><tbody>
      ${r.rows.map(x=>{const b=a.rows.find(y=>y.id===x.id);return `<tr><th>${ud(x.nombre)}</th>${mv?`<td>${b?fT(b.tc.toFixed(3)):'nueva'}</td>`:''}<td class="${x.over?'rinn':''}">${fT(x.tc.toFixed(3))}</td><td>${pc(x.pct,1)}</td><td class="${x.over?'rinn':''}">${takt?f2(takt-x.tc):'—'}</td><td>${x.items.length}</td></tr>`;}).join('')}
      <tr class="rsum"><th>Total</th>${mv?`<td>${fT(a.total.toFixed(3))}</td>`:''}<td>${fT(r.total.toFixed(3))}</td><td></td><td></td><td>${d.els.length}</td></tr></tbody></table></section>
    <section class="rlong"><h2>Elementos por estación</h2>${mv?'<p class="rnote" style="font-size:9.5px;margin:0 0 6px">«Venía de»: estación donde estaba el elemento antes del rebalanceo simulado.</p>':''}<table class="rtbl"><thead><tr><th style="text-align:left">Estación</th><th style="text-align:left">Elemento</th><th>Min/pza</th>${mv?'<th style="text-align:left">Venía de</th>':''}</tr></thead><tbody>
      ${r.rows.map(x=>x.items.map((e,k)=>`<tr>${k===0?`<th rowspan="${x.items.length}">${ud(x.nombre)}<small>TC ${fT(x.tc.toFixed(3))} min</small></th>`:''}<td style="text-align:left">${ud(e.name)}</td><td>${fT(e.t)}</td>${mv?`<td style="text-align:left" class="${e.st!==e.st0?'rinn':''}">${e.st!==e.st0?ud(tkStName(d,e.st0)):'—'}</td>`:''}</tr>`).join('')).join('')}</tbody></table></section>`;
  return {tipo:'Takt y balanceo',titulo:tkName(d),meta,body};};

// ---- Diagrama de flujo de proceso ----
REP.df=d=>{const meta=[['Ubicación',ubLabel(d)],['Proceso',d.proceso],['Área',d.area],['Analista',d.analista],['Fecha',d.fecha],['Método',d.metodo==='PROPUESTO'?'Propuesto':'Actual']];
  if(!d.nodes.length)return {tipo:'Flujo de proceso',titulo:dfName(d),meta,body:repNo('Este diagrama todavía no tiene símbolos.')};
  const S_=dfSummary(d);const ord=dfOrder(d);const no={};ord.forEach((n,i)=>no[n.id]=i+1);const W_=dfWarn(d);
  const body=`<section><h2>Resumen ASME</h2>${repKpis([['Actividades',String(S_.act),S_.dec+' decisi'+(S_.dec===1?'ón':'ones')+' · sin contar inicio/fin'],['Tiempo total',fT(S_.tiempo)+' min',''],['Distancia recorrida',fT(S_.dist)+' m','en transportes'],['Operaciones',pc(S_.pctOp,0),'de las actividades · '+pc(S_.pctOpT,0)+' del tiempo','#1D5FA8']])}
      ${W_.length?`<p class="rnote rinn" style="font-size:9.5px;margin-top:6px"><b>${W_.length} aviso${W_.length>1?'s':''}:</b> ${W_.map(([id,t])=>`paso ${no[id]} (${esc(DF_SYM[dfGet(d,id).t].n.toLowerCase())}) ${t}`).join(' · ')}</p>`:''}
      <div style="height:8px"></div><table class="rtbl"><thead><tr><th style="text-align:left">Símbolo</th><th>Cantidad</th><th>Tiempo (min)</th><th>Distancia (m)</th><th>% del tiempo</th></tr></thead><tbody>
      ${S_.rows.map(x=>`<tr><th>${dfIcon(x.t,22)} ${DF_SYM[x.t].n}</th><td>${x.n}</td><td>${fT(x.tiempo)}</td><td>${x.t==='tra'?fT(x.dist):'—'}</td><td>${S_.tiempo?pc(x.tiempo/S_.tiempo,0):'—'}</td></tr>`).join('')}
      <tr class="rsum"><th>Total</th><td>${S_.act}</td><td>${fT(S_.tiempo)}</td><td>${fT(S_.dist)}</td><td>100 %</td></tr></tbody></table></section>
    <section class="rlong"><h2>Tabla del proceso</h2><table class="rtbl"><thead><tr><th>#</th><th style="text-align:left">Símbolo</th><th style="text-align:left">Acción</th><th style="text-align:left">Responsable</th><th>Tiempo (min)</th><th>Distancia (m)</th><th>Sigue</th></tr></thead><tbody>
      ${ord.map(n=>`<tr><td>${no[n.id]}</td><td style="text-align:left;white-space:nowrap">${dfIcon(n.t,22)} ${DF_SYM[n.t].n}</td><td style="text-align:left">${ud(n.desc)||'—'}</td><td style="text-align:left">${ud(n.resp)||''}</td><td>${num(n.tiempo)?fT(num(n.tiempo)):''}</td><td>${n.t==='tra'&&num(n.dist)?fT(num(n.dist)):''}</td>
        <td>${dfIsDec(n)?`SÍ → ${n.yes!=null?no[n.yes]:'—'} · NO → ${n.no!=null?no[n.no]:'—'}`:n.next!=null?'→ '+no[n.next]:n.t==='ini'&&dfIncoming(d,n.id).length?'fin':'—'}</td></tr>`).join('')}</tbody></table></section>
    <section><h2>Diagrama</h2>${repSvg(dfSvg(d,{ro:true}),'rbox')}</section>`;
  return {tipo:'Flujo de proceso',titulo:dfName(d),meta,body};};

// ---- Diagrama de espagueti ----
REP.sp=d=>{const meta=[['Ubicación',ubLabel(d)],['Método',d.metodo==='PROPUESTO'?'Propuesto':'Actual'],['Qué se sigue',d.sujeto==='MATERIAL'?'Material':'Operador'],['Analista',d.analista],['Fecha',d.fecha],['Escala',fT(d.escala)+' m por cuadro · '+(d.modo==='rec'?'línea recta':'en escuadra')]];
  if(!d.pts.length)return {tipo:'Espagueti',titulo:spName(d),meta,body:repNo('Este diagrama todavía no tiene puntos.')};
  const R=spCalc(d);const P={};d.pts.forEach(p=>P[p.id]=p);const nm=id=>P[id]?P[id].n||'Punto':'—';const idx={};d.pts.forEach((p,i)=>idx[p.id]=i+1);
  const body=`<section><h2>Resumen</h2>${repKpis([['Distancia por ciclo',spM(R.total),R.viajes+' viaje'+(R.viajes!==1?'s':''),'#1D5FA8'],['Por turno',R.porTurno?spM(R.porTurno):'—',R.porTurno?fT(d.ciclos)+' ciclos por turno'+(R.porDia?' · por día '+spM(R.porDia)+' ('+fT(d.turnos)+' turnos)':''):'sin ciclos por turno capturados'],['Tiempo caminando',R.tCiclo?f2(R.tCiclo)+' min':'—',R.tCiclo?'por ciclo'+(R.tTurno?' · '+f2(R.tTurno)+' min por turno':'')+' · a '+fT(d.vel)+' m/min':'sin velocidad capturada'],['Trayecto más repetido',R.top?R.top.n+(R.top.n!==1?' veces':' vez'):'—',R.top?nm(R.top.a)+' ↔ '+nm(R.top.b)+' · '+spM(R.top.t)+' ('+pc(R.total?R.top.t/R.total:0)+' del ciclo)':'']])}
      ${R.topPt!=null?`<p style="margin:6px 0 0;font-size:11px">Punto más visitado: <b>${ud(nm(R.topPt))}</b>, ${R.visits[R.topPt]} visita${R.visits[R.topPt]!==1?'s':''} por ciclo.</p>`:''}</section>
    <section><h2>Diagrama</h2>${repClean(SP,['sel'],()=>repSvg(spSvg(d,'res'),'rbox'))}<p class="rnote" style="font-size:9.5px">Las líneas más gruesas se recorren más veces (×n). El número de cada cuadro es el punto en la tabla de puntos.</p></section>
    ${R.pairs.length?`<section><h2>Trayectos</h2><table class="rtbl"><thead><tr><th style="text-align:left">Trayecto</th><th>Veces</th><th>m cada vez</th><th>m por ciclo</th><th>% del ciclo</th></tr></thead><tbody>
      ${[...R.pairs].sort((x,y)=>y.t-x.t).map(p=>`<tr><th>${ud(nm(p.a))} ↔ ${ud(nm(p.b))}</th><td>${p.n}</td><td>${fT(p.d.toFixed(2))}</td><td>${fT(p.t.toFixed(2))}</td><td>${pc(R.total?p.t/R.total:0,1)}</td></tr>`).join('')}
      <tr class="rsum"><th>Total</th><td>${R.viajes}</td><td></td><td>${fT(R.total.toFixed(2))}</td><td></td></tr></tbody></table></section>`:''}
    <section class="${R.legs.length>30?'rlong':''}"><h2>Puntos y recorrido</h2><table class="rtbl"><thead><tr><th>#</th><th style="text-align:left">Punto</th><th>Visitas por ciclo</th></tr></thead><tbody>${d.pts.map((p,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(p.n||'Punto')}</td><td>${R.visits[p.id]||0}</td></tr>`).join('')}</tbody></table>
      ${R.legs.length?`<table class="rtbl"><thead><tr><th>Viaje</th><th style="text-align:left">De</th><th style="text-align:left">A</th><th>Metros</th></tr></thead><tbody>${R.legs.map((l,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${idx[l.a]}. ${ud(nm(l.a))}</td><td style="text-align:left">${idx[l.b]}. ${ud(nm(l.b))}</td><td>${fT(l.d.toFixed(2))}</td></tr>`).join('')}</tbody></table>`:''}</section>`;
  return {tipo:'Espagueti',titulo:spName(d),meta,body};};

// ---- Cálculo de personal (reporte, no Excel: se trabaja en la app) ----
function repPcNames(d){const names=[];d.months.forEach(rows=>(rows||[]).forEach((r,k)=>{const nm=String(r.nombre||'RENGLÓN '+(k+1)).trim();if(!names.includes(nm))names.push(nm);}));return names;}
REP.pc=d=>{const meta=[['Ubicación',ubLabel(d)],['Nombre',d.nombre],['Tipo',pcTipo(d)],['Año fiscal','FY'+String(d.fy).padStart(2,'0')+' (abril a marzo)'],['Reducción anual',d.red+' %'],['Fecha',d.fecha]];
  const MM=d.months.map(r=>r&&r.length?pcMonth(r,d.red):null);const ok=MM.map((m,i)=>[m,i]).filter(([m])=>m);
  if(!ok.length)return {tipo:'Cálculo de personal',titulo:pcName(d),meta,body:repNo('Todavía no hay meses capturados.')};
  const avg=k=>ok.reduce((a,[m])=>a+m[k],0)/ok.length;const[lm,li]=ok[ok.length-1];const mes=PC_MONTHS[li];
  const names=repPcNames(d);const trLeg=repLeg(names.map((n,s)=>[n,PC_COL[s%PC_COL.length]]));
  const det=ok.map(([m,i])=>`<div class="rblock"><div class="rch"><b>${pcMonthLbl(d,i)}</b><span>${m.n} renglón${m.n!==1?'es':''} · HC volumen ${m.hcVol} · esquema ${m.hcEsq} · meta ${m.hcRed}</span></div>
      <table class="rtbl rnw"><thead><tr><th style="text-align:left">Línea</th><th style="text-align:left">Parte / proceso</th><th>Esq.</th><th>JPH</th><th>OEE</th><th>Volumen</th><th>H disp.</th><th>H req.</th><th>Ocupación</th><th>LAT</th><th>Actual Time</th><th>HC vol.</th><th>HC esq.</th><th>Meta</th></tr></thead><tbody>
      ${m.rows.map((x,k)=>`<tr><th>${esc(x.r.nombre||'RENGLÓN '+(k+1))}</th><td style="text-align:left">${ud([x.r.parte,x.r.proceso].filter(Boolean).join(' · ')||'—')}</td><td>${esc(x.r.esq||'—')}</td><td>${f2(x.jph)}</td><td>${f2(x.oee).replace(/\.00$/,'')}%</td><td>${nInt(pcInt(x.r.vol))}</td><td>${nInt(x.hDisp)}</td><td>${nInt(x.hReq)}</td><td class="${x.occ>1?'rinn':''}">${pc(x.occ,1)}</td><td>${fT(x.lat)}</td><td>${fT(x.at)}</td><td><b>${x.hcVol}</b></td><td>${x.hcEsq}</td><td>${x.hcRed}</td></tr>`).join('')}</tbody></table></div>`).join('');
  const body=`<section><h2>Resumen anual</h2>${repKpis([['% de ocupación promedio',pc(avg('occ'),1),ok.length+' de 12 meses','#1D5FA8'],['LAT promedio',fT(avg('lat')),'min-hombre por pieza'],['Actual Time promedio',fT(avg('at')),'LAT ÷ ocupación'],['Piezas por persona',nInt(avg('pzPer')),'promedio: volumen ÷ plantilla'],
      ['Meta de reducción · '+mes,'−'+lm.reducir,'de '+lm.hcEsq+' a '+lm.hcRed+' personas ('+d.red+' % anual)','#15803D'],['Afectación · '+mes,pc(lm.afecPct,1),lm.afec+' de '+lm.hcEsq+': supervisores, TPM, proyectos y otros',lm.afecPct>0.35?'#C2410C':''],['Arriba del volumen · '+mes,(lm.sobre>0?'+':'')+lm.sobre,lm.sobre>0?'esquema '+lm.hcEsq+' vs '+lm.hcVol+' del volumen':lm.sobre<0?'faltan '+(-lm.sobre)+' personas':'la plantilla coincide',lm.sobre?'#C2410C':'#15803D'],['Holgura de capacidad · '+mes,pc(lm.holg,1),(lm.gap>0?'+':'')+nInt(lm.gap)+' piezas',lm.holg<0?'#C2410C':'#15803D']])}</section>
    <section><h2>Headcount por mes</h2>${repSvg(pcBars(d))}${repLeg([['Según volumen','#1D5FA8'],['Según esquema','#A7B0BA'],['Meta −'+d.red+' %','#15803D','dashed']])}</section>
    <section><h2>% de ocupación por mes</h2>${repSvg(pcOccBars(d))}<p class="rnote" style="font-size:9.5px">Horas requeridas ÷ horas disponibles · en rojo arriba del 100 % (falta capacidad).</p></section>
    <section><h2>Personal que agrega valor vs afectación</h2>${repSvg(pcStack(d))}${repLeg([['Agrega valor (operadores + líderes)','#1D5FA8'],['Afectación (en rojo arriba de 35 %)','#F0B49A']])}</section>
    <section><h2>Trazabilidad por línea · Actual Time</h2>${repSvg(pcTrace(d,'at'))}${trLeg}</section>
    <section><h2>Trazabilidad por línea · % de ocupación</h2>${repSvg(pcTrace(d,'occ'))}${trLeg}</section>
    <section><h2>Resumen por mes</h2><table class="rtbl rnw"><thead><tr><th style="text-align:left">Mes</th><th>Renglones</th><th>HC volumen</th><th>HC esquema</th><th>Meta</th><th>Reducir</th><th>Ocupación</th><th>LAT</th><th>Actual Time</th><th>Afectación</th><th>Volumen</th><th>Capacidad</th><th>GAP</th></tr></thead><tbody>
      ${ok.map(([m,i])=>`<tr><th>${pcMonthLbl(d,i)}</th><td>${m.n}</td><td><b>${m.hcVol}</b></td><td>${m.hcEsq}</td><td class="rnec">${m.hcRed}</td><td>−${m.reducir}</td><td class="${m.occ>1?'rinn':''}">${pc(m.occ,1)}</td><td>${fT(m.lat)}</td><td>${fT(m.at)}</td><td>${pc(m.afecPct,1)}</td><td>${nInt(m.vol)}</td><td>${nInt(m.cap)}</td><td class="${m.gap<0?'rinn':''}">${m.gap>0?'+':''}${nInt(m.gap)}</td></tr>`).join('')}</tbody></table></section>
    <section class="rlong"><h2>Detalle por mes y línea</h2>${det}</section>`;
  return {tipo:'Cálculo de personal',titulo:pcName(d),meta,body};};

// ---- Actual Time ----
REP.at=d=>{const meta=[['Ubicación',ubLabel(d)],['Nombre',d.nombre],['Tipo',atTipo(d)+(atHasMH(d)?' + manejo de materiales':'')],['Año fiscal','FY'+String(d.fy).padStart(2,'0')+' (abril a marzo)']];
  const areas=atHasMH(d)?['ens','mh']:['ens'];const AF='#C2410C',SA='#E9A47F',TG='#1D5FA8';
  const chart=(area,o)=>`<div class="rblock"><h3 style="font-size:11px;margin:10px 0 2px">${o.title}${o.sub?` <span style="font-weight:400;color:#5B6673">· ${o.sub}</span>`:''}</h3>${repSvg(atChart(d,area,o))}${repLeg(o.bars.map(b=>[b[0],b[1]]).concat((o.lines||[]).map(l=>[l[0],l[1],l[3]?'dashed':'solid'])))}</div>`;
  const parts=areas.map(area=>{const R=atAll(d,area);const ok=R.map((r,i)=>[r,i]).filter(([r])=>r&&r.prod);const tl=area==='mh'?'LAT':atTimeLbl(d.tipo);const pre=areas.length>1?atAreaLbl(area)+' · ':'';
    if(!ok.length)return `<section><h2>${pre}Resumen anual</h2>${repNo('Todavía no hay meses capturados.')}</section>`;
    const sum=k=>ok.reduce((a,[r])=>a+r[k],0);const atY=sum('prod')?sum('trab')*60/sum('prod'):0;const effY=sum('trab')?sum('horasReq')/sum('trab'):0;
    const tgt=ok.filter(([r])=>r.target);const tgtY=tgt.length?tgt.reduce((a,[r])=>a+r.target*r.prod,0)/tgt.reduce((a,[r])=>a+r.prod,0):0;const[lm,li]=ok[ok.length-1];const mes=PC_MONTHS[li];
    const ext=atIsDSTR(d)?['DSTR · '+mes,f2(lm.dstrReal),'objetivo '+f2(lm.dstrObj),lm.dstrObj&&lm.dstrReal>lm.dstrObj?'#C2410C':'#15803D']:atIsJPMH(d)?['JPMH · '+mes,f2(lm.jpmh),'compromiso '+f2(lm.jpmhCommit),lm.jpmh<lm.jpmhCommit?'#C2410C':'#15803D']:['Forecast · '+mes,f2(lm.forecast),'(60 ÷ JPH real) × HC ÷ grupos'];
    return `<section><h2>${pre}Resumen anual</h2>${repKpis([['Actual Time del año',f2(atY),'Σ horas trabajadas × 60 ÷ Σ producción',tgtY&&atY>tgtY?'#C2410C':'#15803D'],['Meta del año',f2(tgtY),'TARGET ponderado por producción'],['Eficiencia del año',pc(effY,1),'Σ horas requeridas ÷ Σ trabajadas','#1D5FA8'],['Producción del año',nInt(sum('prod')),ok.length+' mes'+(ok.length!==1?'es':'')],
        ['Actual Time · '+mes,f2(lm.atReal),'meta '+f2(lm.target)+' · sin afectación '+f2(lm.atSA),lm.target&&lm.atReal>lm.target?'#C2410C':'#15803D'],['GAP de personal · '+mes,(lm.gap>0?'+':'')+f1(lm.gap),'operadores '+f1(lm.res2)+' vs requeridos '+f1(lm.hcReq),lm.gap?'#C2410C':'#15803D'],[(lm.dif<0?'Ausentismo':'Arriba del plan')+' · '+mes,(lm.dif<0?'−':'+')+f1(Math.abs(lm.dif)),'HC trabajado '+f1(lm.hcTrab)+' vs plan '+f1(lm.hcPlan),'#C2410C'],ext])}</section>
      <section class="rlong"><h2>${pre}Gráficas del año</h2>
        ${chart(area,{title:'Actual Time',sub:'min-hombre por pieza · abajo es mejor',bars:[['Con afectación',AF,r=>r.atReal],['Sin afectación',SA,r=>r.atSA]],lines:[['Meta (TARGET)',TG,r=>r.target,1]]})}
        ${chart(area,{title:'Eficiencia',sub:'horas requeridas ÷ trabajadas · arriba es mejor',bars:[['Eficiencia',AF,r=>r.efic*100],['Sin afectación',SA,r=>r.eficSA*100]],lines:[['Compromiso 100 %',TG,()=>100,1]],fmt:v=>f1(v)+'%',ax:v=>Math.round(v)+'%',min:100})}
        ${chart(area,{title:'Horas trabajadas vs requeridas',bars:[['Trabajadas','#A7B0BA',r=>r.trab],['Requeridas','#1D5FA8',r=>r.horasReq]],fmt:v=>nInt(v),labels:false})}
        ${area==='ens'?chart(area,{title:'Producción mensual',sub:'piezas',bars:[['Producción','#3E7BC4',r=>r.prod]],fmt:v=>nInt(v)}):''}
        ${area==='ens'?chart(area,{title:'JPH real vs comprometido',bars:[['JPH real','#1D5FA8',(r,m)=>num(m.jphRes)]],lines:[['JPH comprometido','#C2410C',(r,m)=>num(m.jphCommit),1]],fmt:v=>f1(v)}):''}
        ${atIsDSTR(d)?chart(area,{title:'DSTR',sub:'Actual Time ÷ tiempo estándar de diseño · abajo es mejor',bars:[['Real (con afectación)',AF,r=>r.dstrReal],['Real (sin afectación)',SA,r=>r.dstrRealSA]],lines:[['Objetivo',TG,r=>r.dstrObj,1]]}):''}
        ${atIsJPMH(d)?chart(area,{title:'JPMH',sub:'piezas por hora-hombre de un grupo · arriba es mejor',bars:[['JPMH real','#1D5FA8',r=>r.jpmh]],lines:[['Compromiso','#C2410C',r=>r.jpmhCommit,1]]}):''}</section>
      <section><h2>${pre}Cascada de headcount · ${atMonthLbl(d,li)}</h2><p class="rnote" style="font-size:9.5px;margin:0 0 4px">Del plan al HC requerido, en personas equivalentes (último mes capturado).</p>${repSvg(atCasc(lm))}</section>
      <section><h2>${pre}Resumen por mes</h2><table class="rtbl rnw"><thead><tr><th style="text-align:left">Mes</th><th>Producción</th><th>Horas req.</th><th>Horas trab.</th><th>${tl} pond.</th><th>Eficiencia</th><th>Sin afect.</th><th>Actual Time</th><th>Sin afect.</th><th>Meta</th><th>HC trab.</th><th>Operadores</th><th>HC req.</th><th>GAP</th>${atIsDSTR(d)?'<th>DSTR</th><th>Obj.</th>':''}${atIsJPMH(d)?'<th>JPMH</th><th>Compr.</th>':''}</tr></thead><tbody>
        ${ok.map(([r,i])=>`<tr><th>${atMonthLbl(d,i)}</th><td>${nInt(r.prod)}</td><td>${nInt(r.horasReq)}</td><td>${nInt(r.trab)}</td><td>${f2(r.st)}</td><td>${pc(r.efic,1)}</td><td>${pc(r.eficSA,1)}</td><td class="${r.target&&r.atReal>r.target?'rinn':'rnec'}"><b>${f2(r.atReal)}</b></td><td>${f2(r.atSA)}</td><td>${f2(r.target)}</td><td>${f1(r.hcTrab)}</td><td>${f1(r.res2)}</td><td>${f1(r.hcReq)}</td><td class="${r.gap?'rinn':''}">${r.gap>0?'+':''}${f1(r.gap)}</td>${atIsDSTR(d)?`<td>${f2(r.dstrReal)}</td><td>${f2(r.dstrObj)}</td>`:''}${atIsJPMH(d)?`<td>${f2(r.jpmh)}</td><td>${f2(r.jpmhCommit)}</td>`:''}</tr>`).join('')}</tbody></table></section>`;}).join('');
  return {tipo:'Actual Time',titulo:atName(d),meta,body:parts};};

// ---- eliminar estudio desde la lista (todos los formatos) ----
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-sdel]');if(!t)return;e.stopPropagation();
  const[k,id]=t.dataset.sdel.split('|');const nm=t.dataset.sdeln||'este estudio';
  ask('¿Eliminar este estudio?','Se borra «'+nm+'» con toda su información. No se puede deshacer.','Eliminar estudio',()=>{
    if(k==='ws'){S.studies=S.studies.filter(x=>x.id!=id);if(S.draft&&S.draft.id==id)S.draft=null;}
    else if(k==='ds'){DS.studies=DS.studies.filter(x=>x.id!=id);if(DS.d&&DS.d.id==id)DS.d=null;}
    else if(k==='st'){ST.studies=ST.studies.filter(x=>x.id!=id);if(ST.d&&ST.d.id==id)ST.d=null;}
    else if(k==='mm'){MM.studies=MM.studies.filter(x=>x.id!=id);if(MM.d&&MM.d.id==id)MM.d=null;}
    else if(k==='df'){DF.studies=DF.studies.filter(x=>x.id!=id);if(DF.d&&DF.d.id==id)DF.d=null;}
    else if(k==='at'){AT.studies=AT.studies.filter(x=>x.id!=id);if(AT.d&&AT.d.id==id)AT.d=null;}
    else if(k==='pc'){PC.studies=PC.studies.filter(x=>x.id!=id);if(PC.d&&PC.d.id==id)PC.d=null;}
    else if(k==='sm'){SM.studies=SM.studies.filter(x=>x.id!=id);if(SM.d&&SM.d.id==id)SM.d=null;}
    else if(k==='tk'){TK.studies=TK.studies.filter(x=>x.id!=id);if(TK.d&&TK.d.id==id)TK.d=null;}
    else if(k==='hs'){HS.studies=HS.studies.filter(x=>x.id!=id);if(HS.d&&HS.d.id==id)HS.d=null;}
    else if(k==='sp'){SP.studies=SP.studies.filter(x=>x.id!=id);if(SP.d&&SP.d.id==id)SP.d=null;}
    render();});},true);

const TUT_SEEN=new Set();
const tutReady=t=>!!(t&&t.pasos);
const tutBtn=id=>tutReady(TUTS.find(t=>t.id===id))?`<button class="btn ghost" type="button" data-go="aprende-${id}">${svg('aprende',18)} Ver tutorial</button>`:'';

function vAprende(){
  setHead('Aprende',[['Tutoriales','aprende']]);
  return `<section class="glass panel"><div><h2>Aprende con una demo en vivo</h2><p class="sub">Un bot usa la app real con datos ficticios y te explica cada paso. Después lo haces tú, guiado. Nada de lo que se hace en un tutorial se guarda.</p></div></section>
  ${TUT_GROUPS.map(([g,l])=>`<section aria-label="${l}"><b style="font-size:15px;color:var(--ink2);display:block;margin:4px 2px 10px">${l}</b>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${TUTS.filter(t=>t.grupo===g).map(t=>{const ok=tutReady(t);const tag=!ok?'PRÓXIMAMENTE':TUT_SEEN.has(t.id)?'VISTO':'NUEVO';
      return `<button type="button" class="fmt tutcard ${ok?'':'off'}" data-go="aprende-${t.id}"><span class="t"><b>${ud(t.nombre)}</b><span class="tag ${tag==='NUEVO'?'on':''}">${tag}</span></span><span class="d">${esc(t.pregunta)}</span>${ok?`<span class="tutmin">${svg('estudios',15,2)} ≈ ${t.min} min</span>`:''}</button>`;}).join('')}</div></section>`).join('')}`;
}
function vAprendeFicha(id){
  const t=TUTS.find(x=>x.id===id);if(!t)return vAprende();
  setHead(t.nombre,[['Aprende','aprende'],[t.nombre,'aprende-'+id]]);
  const back=`<button class="btn ghost" type="button" data-go="aprende">${svg('back',18,2.2)} Todos los tutoriales</button>`;
  if(!tutReady(t))return `<section class="glass panel empty"><span class="tag">PRÓXIMAMENTE</span><h2>${ud(t.nombre)}</h2><p>${esc(t.pregunta)}<br>Este tutorial se arma cuando la pantalla tenga su diseño final, para que no quede viejo.</p>${back}</section>`;
  return `<section class="glass panel view tutficha">
    <span class="tag on">TUTORIAL · ≈ ${t.min} MIN</span>
    <h2 class="tutq">${esc(t.pregunta)}</h2>

  </section>`;
}

// ---------- motor ----------
let TR=null;let tutRunId=0;const TUT_ABORT={};
const tutSnapNow=()=>structuredClone({S,DS,ST,MM,SM,PC,AT,EC,DF,TK,HS,SP,uid});
function tutRestore(s){const c=structuredClone(s);
  [[S,'S'],[DS,'DS'],[ST,'ST'],[MM,'MM'],[SM,'SM'],[PC,'PC'],[AT,'AT'],[EC,'EC'],[DF,'DF'],[TK,'TK'],[HS,'HS'],[SP,'SP']].forEach(([o,k])=>{Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,c[k]);});uid=c.uid;}
const tutPhone=()=>window.innerWidth<=700;
const tutNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// Texto de un elemento: lo visible más lo escrito en sus campos (los nombres editables viven en inputs)
const tutText=e=>e.textContent+' '+[...e.querySelectorAll('input,textarea')].map(i=>i.value).join(' ');
function tutSel(p,k){const s=p.toca||p.escribe||p.elige||p.señala||(p.serie&&p.serie.replace('{v}',p.v[(k||0)%p.v.length]));return s;}
// Busca el elemento: si hay txt, el más profundo de los que contienen ese texto
function tutQuery(sel,txt,en){
  if(en){const c=tutQuery(en,txt);if(!c)return null;return [...c.querySelectorAll(sel)].find(e=>e.getClientRects().length&&!e.disabled)||null;}
  let L=[...document.querySelectorAll(sel)].filter(e=>e.getClientRects().length&&!e.disabled);
  if(txt){const n=tutNorm(txt);L=L.filter(e=>tutNorm(tutText(e)).includes(n));L=L.filter(e=>!L.some(o=>o!==e&&e.contains(o)));}
  return L[0]||null;}
// ¿El toque del usuario cae en el objetivo del paso? (con contenedor: dentro del renglón correcto)
function tutHit(x,sel,p){const el=x.closest&&x.closest(sel);if(!el)return false;if(!p.en)return !p.txt||tutNorm(tutText(el)).includes(tutNorm(p.txt));const c=el.closest(p.en);return !!c&&tutNorm(tutText(c)).includes(tutNorm(p.txt));}
async function tutFind(run,sel,txt,en){const t0=Date.now();
  while(Date.now()-t0<4000){tutAlive(run);const el=tutQuery(sel,txt,en);if(el)return el;await new Promise(r=>setTimeout(r,60));}
  throw {tutErr:'No se encontró «'+(en?en+' › ':'')+sel+(txt?' · '+txt:'')+'». La pantalla cambió: hay que actualizar este tutorial.'};}
function tutAlive(run){if(!TR||TR.run!==run)throw TUT_ABORT;}
// Espera respetando pausa, velocidad y «Siguiente»
async function tutWait(run,ms){let left=ms;
  while(left>0){tutAlive(run);if(TR.skip){TR.skip=false;return;}
    if(!TR.paused||TR.once)left-=50*TR.speed;await new Promise(r=>setTimeout(r,50));}}
async function tutGate(run){while(TR&&TR.run===run&&TR.paused&&!TR.once)await new Promise(r=>setTimeout(r,60));tutAlive(run);}
const tutRead=s=>Math.max(1900,String(s).split(/\s+/).length*290);

function tutLayer(){let L=document.getElementById('tut');if(L)return L;
  L=document.createElement('div');L.id='tut';
  L.innerHTML=`<div class="tutshield"></div><div class="tutring" hidden></div><div class="tutcur" hidden><span></span></div>
  <div class="tutbub glass" role="status" aria-live="polite" hidden><span class="tutn mono"></span><p></p><span class="tutsug"></span></div>
  <div class="tutbar glass" role="toolbar" aria-label="Controles del tutorial"></div><div class="tutend" hidden></div>`;
  document.body.appendChild(L);return L;}
function tutBar(){const L=tutLayer();const T=TR;if(!T)return;const n=T.t.pasos.length;const demo=T.mode==='demo';
  L.querySelector('.tutbar').innerHTML=`<span class="tutpos mono">${Math.min(T.i+1,n)} / ${n}</span>
    ${true?`<button type="button" class="tutb" data-tutc="pause" aria-label="${T.paused?'Seguir':'Pausar'}">${T.paused?'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'}<span>${T.paused?'Seguir':'Pausa'}</span></button>`:''}
    <button type="button" class="tutb" data-tutc="next">${svg('next',20,2.4)}<span>Siguiente</span></button>
    <button type="button" class="tutb" data-tutc="restart">${svg('undo',20,2.2)}<span>Reiniciar</span></button>
    ${true?`<button type="button" class="tutb" data-tutc="speed" aria-label="Velocidad">${T.speed>=2?'2×':'1×'}</button>`:''}
    <button type="button" class="tutb" data-tutc="exit" aria-label="Salir del tutorial">${svg('plus',20,2.4).replace('<svg','<svg style="transform:rotate(45deg)"')}<span>Salir</span></button>`;}

// Coloca anillo, globo y cursor siguiendo al elemento (la app vuelve a pintar la pantalla seguido)
function tutTrack(){if(!TR)return;const L=tutLayer();const ring=L.querySelector('.tutring'),bub=L.querySelector('.tutbub');
  let el=TR.el;if(el&&!el.isConnected&&TR.sel){el=TR.el=tutQuery(TR.sel,TR.txt,TR.en);}
  if(el&&!ring.hidden){const r=el.getBoundingClientRect();if(tutPhone())bub.classList.toggle('up',r.top+r.height/2>innerHeight*0.5);Object.assign(ring.style,{left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:r.height+12+'px'});
    if(!tutPhone()&&!bub.hidden){const bw=bub.offsetWidth,bh=bub.offsetHeight,barH=86;let top=r.bottom+14;
      if(top+bh>innerHeight-barH)top=r.top-bh-14;if(top<8)top=Math.min(innerHeight-barH-bh,Math.max(8,r.top+12));
      let left=Math.min(Math.max(12,r.left+r.width/2-bw/2),innerWidth-bw-12);bub.style.left=left+'px';bub.style.top=top+'px';}}
  requestAnimationFrame(tutTrack);}
function tutSay(text,sug){const L=tutLayer();const b=L.querySelector('.tutbub');const n=TR.t.pasos.length;
  b.querySelector('.tutn').textContent=(TR.mode==='demo'?'DEMO':'HAZLO TÚ')+' · PASO '+Math.min(TR.i+1,n)+' DE '+n;
  b.querySelector('p').textContent=text;const s=b.querySelector('.tutsug');s.textContent=sug||'';s.hidden=!sug;
  b.classList.toggle('sheet',tutPhone());b.hidden=false;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
async function tutAim(run,el,sel,txt,en){TR.el=el;TR.sel=sel;TR.txt=txt;TR.en=en;
  const top=tutPhone()?70:90,bottom=innerHeight-(tutPhone()?Math.round(innerHeight*.36)+80:110);if(getComputedStyle(el.closest('.dfpop.sheet')||document.body).position==='fixed'){tutLayer().querySelector('.tutring').hidden=false;return;}
  let r=el.getBoundingClientRect();
  if(r.top<top||r.bottom>bottom){window.scrollBy({top:r.top-(top+Math.max(0,(bottom-top-r.height)/2)),behavior:'smooth'});await tutWait(run,420);}
  tutLayer().querySelector('.tutring').hidden=false;}
async function tutMove(run,el,ms){const c=tutLayer().querySelector('.tutcur');c.hidden=false;const r=el.getBoundingClientRect();
  const x=r.left+Math.min(r.width/2,r.width-14),y=r.top+Math.min(r.height/2,r.height-10);
  c.style.transitionDuration=Math.round(ms/TR.speed)+'ms';c.style.transform=`translate(${x}px,${y}px)`;await tutWait(run,ms);}
async function tutClick(run,el){const c=tutLayer().querySelector('.tutcur');c.classList.remove('tutping');void c.offsetWidth;c.classList.add('tutping');
  await tutWait(run,160);tutAlive(run);if(typeof el.click==='function')el.click();else el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));await tutWait(run,260);}
async function tutType(run,el,val,clear){el.focus({preventScroll:true});if(clear){el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));}
  for(const ch of val){tutAlive(run);el.value+=ch;el.dispatchEvent(new Event('input',{bubbles:true}));await tutWait(run,55);}
  el.dispatchEvent(new Event('change',{bubbles:true}));el.blur();}

// Modo guiado: espera a que el usuario haga la acción en el elemento correcto
function tutExpect(run,p){return new Promise((res,rej)=>{TR.expect={p,res,count:0};const iv=setInterval(()=>{if(!TR||TR.run!==run){clearInterval(iv);rej(TUT_ABORT);}},120);TR.expect.iv=iv;});}
function tutDone(){const e=TR&&TR.expect;if(!e)return;clearInterval(e.iv);TR.expect=null;setTimeout(e.res,30);}
document.addEventListener('click',e=>{if(!TR||TR.mode!=='tu'||!TR.expect)return;const x=e.target;if(x.closest&&x.closest('#tut'))return;
  const ex=TR.expect,p=ex.p;const sel=p.toca||p.escribe||p.elige||p.base;const ok=sel&&tutHit(x,sel,p.serie?{}:p);
  if(!ok){e.preventDefault();e.stopPropagation();const b=document.querySelector('#tut .tutbub');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
  if(p.toca)tutDone();
  if(p.serie){ex.count++;tutSay(p.tu||p.di,'Llevas '+ex.count+' de '+p.nTu);if(ex.count>=p.nTu)tutDone();}},true);
document.addEventListener('keydown',e=>{if(!TR||TR.mode!=='tu'||!TR.expect)return;const p=TR.expect.p;if(e.key==='Enter'&&p.escribe&&tutHit(e.target,p.escribe,p))tutDone();},true);
document.addEventListener('change',e=>{if(!TR||TR.mode!=='tu'||!TR.expect)return;const p=TR.expect.p;const s=p.escribe||p.elige;if(s&&tutHit(e.target,s,p)&&e.target.value)tutDone();},true);

// En inglés, lo que escribe el bot y el texto con que busca un elemento salen del diccionario (como el resto de la pantalla)
function tutLoc(p){if(!trOn())return p;const q=Object.assign({},p);if(q.escribe&&typeof q.valor==='string')q.valor=trData(q.valor);if(q.txt)q.txt=trData(q.txt);return q;}
async function tutStep(run,p){
  if(p.ir){go(p.ir);await tutWait(run,250);}
  const sel=tutSel(p,0);const el=await tutFind(run,sel,p.txt,p.en);await tutAim(run,el,sel,p.txt,p.en);
  if(TR.mode==='tu'&&p.señala){tutSay(p.di);await tutWait(run,tutRead(p.di));return;} // explicar = como video: avanza solo
  if(TR.mode==='tu'){
    const sug=p.escribe?'Escribe, por ejemplo: '+p.valor+' · luego Enter o «Siguiente»':p.elige?'Elige: '+p.valor:p.serie?'Llevas 0 de '+p.nTu:'';
    tutSay(p.tu||p.di,sug);if(p.escribe)el.focus({preventScroll:true});
    if(p.serie){TR.sel=p.base;TR.en=null;TR.el=tutQuery(p.base);}
    await tutExpect(run,p);return;}
  tutSay(p.di);await tutMove(run,el,650);
  if(p.señala){await tutWait(run,tutRead(p.di));return;}
  await tutWait(run,Math.max(900,tutRead(p.di)-900));
  if(p.toca)await tutClick(run,el);
  else if(p.escribe){await tutClick(run,el);const f=tutQuery(sel,p.txt,p.en)||el;await tutType(run,f,p.valor,p.limpiar);if(p.enter){await tutWait(run,250);tutAlive(run);f.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));}await tutWait(run,350);}
  else if(p.elige){el.value=p.valor;el.dispatchEvent(new Event('change',{bubbles:true}));await tutWait(run,500);}
  else if(p.serie){for(let k=0;k<p.v.length;k++){await tutGate(run);const s=tutSel(p,k);const b=await tutFind(run,s);TR.el=b;TR.sel=s;await tutMove(run,b,280);await tutClick(run,b);}}
}
async function tutLoop(run){
  try{while(TR&&TR.run===run&&TR.i<TR.t.pasos.length){
      await tutGate(run);TR.once=false;tutBar();document.body.dataset.tut='run';
      await tutStep(run,tutLoc(TR.t.pasos[TR.i]));tutAlive(run);TR.i++;}
    tutAlive(run);tutFinish();}
  catch(e){if(e===TUT_ABORT)return;if(!TR||TR.run!==run)return;
    TR.err=e&&e.tutErr||String(e&&e.message||e);document.body.dataset.tut='error';tutSay('⚠ '+TR.err);TR.paused=true;tutBar();console.warn('[tutorial]',TR.err);}}
function tutStart(id,mode,speed){const t=TUTS.find(x=>x.id===id);if(!tutReady(t))return;
  const snap=TR?TR.snap:tutSnapNow();if(TR){tutRestore(snap);}
  TR={t,mode,i:0,paused:false,once:false,skip:false,speed:speed||1,run:++tutRunId,snap,el:null,sel:null,expect:null,err:null};
  window.scrollTo({top:0});document.body.classList.add('tutoring');document.body.classList.toggle('tutdemo',mode==='demo');
  const L=tutLayer();L.hidden=false;L.querySelector('.tutend').hidden=true;L.querySelector('.tutcur').hidden=true;L.querySelector('.tutring').hidden=true;L.querySelector('.tutbar').hidden=false;
  tutBar();requestAnimationFrame(tutTrack);tutLoop(TR.run);}
function tutFinish(){const T=TR;TUT_SEEN.add(T.t.id);document.body.dataset.tut='fin';const L=tutLayer();
  ['.tutring','.tutcur','.tutbub'].forEach(s=>L.querySelector(s).hidden=true);L.querySelector('.tutbar').hidden=true;
  const end=L.querySelector('.tutend');const demo=T.mode==='demo';
  end.innerHTML=`<div class="mbox glass"><div class="micon" style="background:rgba(29,95,168,.12);color:var(--blue)">${svg('aprende',26,2)}</div>
    <h2>${demo?'Así se hace un '+esc(T.t.nombre):'¡Listo! Lo hiciste tú'}</h2><p>${demo?'Ahora hazlo tú: el globo te dice qué tocar y espera a que lo hagas.':'Ya sabes hacer el flujo completo. Con un estudio real, cuenta hasta que la precisión cumpla.'} Al salir, todo lo del tutorial se descarta.</p>
    <div class="row" style="margin-top:20px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" type="button" data-tutc="exit">Volver a Aprende</button>
    <button class="btn ghost" type="button" data-tutc="${demo?'restart':'demo'}">${demo?'Repetir demo':'Ver la demo'}</button>
    <button class="btn orange" type="button" data-tutc="${demo?'tu':'restart'}">${demo?'Ahora hazlo tú':'Repetir'}</button></div></div>`;
  end.hidden=false;}
function tutExit(){if(!TR)return;const id=TR.t.id;tutRestore(TR.snap);TR=null;tutRunId++;
  document.body.classList.remove('tutoring','tutdemo');delete document.body.dataset.tut;const L=document.getElementById('tut');if(L)L.remove();go('aprende-'+id);}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-tutgo]');if(!b)return;const[id,m]=b.dataset.tutgo.split('|');tutStart(id,m);});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#tut [data-tutc]');if(!b||!TR)return;e.stopPropagation();const c=b.dataset.tutc;
  if(c==='pause'){TR.paused=!TR.paused;TR.once=false;tutBar();}
  else if(c==='next'){if(TR.mode==='tu'&&TR.expect)tutDone();else if(TR.paused)TR.once=true;else TR.skip=true;}
  else if(c==='speed'){TR.speed=TR.speed>=2?1:2;tutBar();}
  else if(c==='restart')tutStart(TR.t.id,TR.mode,TR.speed);
  else if(c==='tu'||c==='demo')tutStart(TR.t.id,c);
  else if(c==='exit')tutExit();},true);

// Patrón repositorio: los formatos NO saben dónde se guarda. Solo llaman storeSave / storeRemove.
// Hoy el almacén guarda en el navegador (IndexedDB: funciona sin internet). Cuando llegue el servidor,
// solo cambia el interior de este bloque y los 9 formatos no se tocan.
// Reglas de Angel (2026-11-12): guardar es explícito y es todo o nada; los estudios se guardan completos,

// <store-pure> Funciones puras: se prueban en Node (parts/storetest.js) leyendo este bloque directo de index.html.
// Identificador único universal: no se repite entre días, dispositivos ni usuarios (lo necesitará el servidor).
function storeUUID(){try{if(globalThis.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(_){}
  return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);}
// «Sobre» común para todo lo que se guarda: qué es, de qué versión de formato y cuándo; el estudio va adentro.
function storeEnvelope(kind,d,schema,now,prev){
  return {uuid:d._uuid,kind,schema,createdAt:prev&&prev.createdAt?prev.createdAt:now,savedAt:now,data:JSON.parse(JSON.stringify(d))};}
// Migraciones: si un formato cambia de versión, los estudios viejos se convierten al abrirlos.
// migs[v] convierte los datos de la versión v a la v+1. Sin migración disponible = error (nunca se adivina).
function storeMigrate(env,schemaNow,migs){let v=env.schema||0;let data=env.data;
  if(v>schemaNow)throw new Error('El estudio es de una versión más nueva de la app ('+v+' > '+schemaNow+').');
  while(v<schemaNow){const f=migs&&migs[v];if(typeof f!=='function')throw new Error('Falta la migración de la versión '+v+' a la '+(v+1)+' para '+env.kind+'.');data=f(JSON.parse(JSON.stringify(data)));v++;}
  return Object.assign({},env,{schema:v,data});}
// Número más alto usado como identificador interno (campos «id» y llaves numéricas, como las de la asignación).
// Al abrir la app, el contador sigue desde ahí: así lo nuevo nunca choca con lo guardado.
function storeMaxId(o){let m=0;const seen=new Set();
  (function walk(x){if(!x||typeof x!=='object'||seen.has(x))return;seen.add(x);
    if(Array.isArray(x)){x.forEach(walk);return;}
    for(const k of Object.keys(x)){if(/^\d+$/.test(k))m=Math.max(m,+k);const v=x[k];
      if(k==='id'&&typeof v==='number'&&isFinite(v))m=Math.max(m,v);if(v&&typeof v==='object')walk(v);}})(o);
  return m;}
// Estado de un estudio frente a lo guardado: 'nuevo' (nunca guardado), 'cambios' (difiere) u 'ok'.
function storeStateOf(d,saved){if(!d||!d._uuid||!saved.has(d._uuid))return 'nuevo';return JSON.stringify(d)===saved.get(d._uuid)?'ok':'cambios';}
// </store-pure>

// <i18n-pure> Motor de traducción (inglés). Funciones puras: se prueban en Node (parts/i18ntest.js) leyendo este bloque.
// La app está escrita en español; con EN, cada texto que se pinta pasa por trText: 1) búsqueda exacta,
// 2) sin distinguir mayúsculas (y se reaplica el estilo del original), 3) plantillas con huecos {n} (número) y {x} (texto).
// En la salida, {n}/{x} se llenan en orden y {1},{2}… por posición. Lo que no se conoce se regresa igual.
function trCase(src,out){const up=src.toUpperCase(),lo=src.toLowerCase();
  if(src===up&&src!==lo)return out.toUpperCase();
  const f=src.match(/\p{L}/u);if(!f)return out;const i=out.search(/\p{L}/u);if(i<0)return out;
  const c=f[0]===f[0].toUpperCase()?out[i].toUpperCase():out[i].toLowerCase();return out.slice(0,i)+c+out.slice(i+1);}
function trMake(dic,tpl){const norm=s=>s.replace(/\s+/g,' ');
  const EDGE=/^[\s·•|—–:,;]+|[\s·•|—–:,;]+$/g;const ex=new Map(),low=new Map();Object.keys(dic).forEach(k=>{const n=norm(k.replace(EDGE,''));ex.set(n,dic[k]);if(!low.has(n.toLowerCase()))low.set(n.toLowerCase(),dic[k]);});
  const re=s=>s.replace(/[.*+?^$()|[\]\\]/g,'\\$&');
  const T=(tpl||[]).map(([es,en])=>{const kinds=[];const src='^'+es.split(/(\{[nx]\})/).map(p=>{if(p==='{n}'){kinds.push('n');return '([-+]?\\d[\\d.,]*%?)';}if(p==='{x}'){kinds.push('x');return '(.+?)';}return re(p);}).join('')+'$';
    return {cs:new RegExp(src,'u'),ci:new RegExp(src,'iu'),kinds,en,lit:es.replace(/\{[nx]\}/g,'').length,weak:(es.replace(/\{[nx]\}/g,'').match(/\p{L}/gu)||[]).length<4};}).sort((a,b)=>b.lit-a.lit);
  const fill=(t,g)=>{let k=0;return t.en.replace(/\{(n|x|\d+)\}/g,(_,w)=>{const j=/\d/.test(w)?+w-1:k++;const v=g[j];return v==null?'':(t.kinds[j]==='x'?tr(v):v);});};
  const cache=new Map();
  function core(c){if(ex.has(c))return ex.get(c);const l=low.get(c.toLowerCase());if(l!=null)return trCase(c,l);
    // Plantilla «débil» (poco texto fijo, p. ej. «{x} de {x}»): solo aplica si todos sus textos se conocen; si no, atraparía cualquier frase.
    const okG=(t,g)=>!t.weak||t.kinds.every((k,j)=>k!=='x'||tr(g[j])!==g[j]);
    for(const t of T){let g=c.match(t.cs);if(g&&okG(t,g.slice(1)))return fill(t,g.slice(1));g=c.match(t.ci);if(g&&okG(t,g.slice(1)))return trCase(c,fill(t,g.slice(1)));}
    return null;}
  function tr(s){if(typeof s!=='string'||!/\p{L}/u.test(s))return s;
    if(cache.has(s))return cache.get(s);
    // espacios y separadores de las orillas («·», «:», «—»…) se conservan tal cual; se traduce lo de en medio
    const a=s.match(/^[\s·•|—–:,;]*/)[0];const b=s.slice(a.length).match(/[\s·•|—–:,;]*$/)[0];const c=norm(s.slice(a.length,s.length-b.length));if(!c)return s;const r=core(c);const out=r==null?s:a+r+b;
    if(cache.size>20000)cache.clear();cache.set(s,out);return out;}
  return tr;}
// </i18n-pure>
