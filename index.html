// ---- cascada de HC ----
function atCasc(r){
  const S=[['PLAN',r.hcPlan,1],[r.dif<0?'AUSENTISMO':'ARRIBA DEL PLAN',r.dif,0],['HC TRABAJADO',r.hcTrab,1],
    ...AT_AFECT.map(k=>[AT_AFL[k].replace(' (PIC)','').toUpperCase(),-r.afHC[k],0]),['RESULTADO',r.res1,1],
    ['SV',-r.sv,0],['LÍDER',-r.lider,0],['OTROS IND.',-r.otrosInd,0],['OPERADORES',r.res2,1],['GAP',-r.gap,0],['HC REQUERIDO',r.hcReq,1]];
  let run=0;const B=S.map(([l,v,tot],i)=>{let a,b;if(tot){a=0;b=v;run=v;}else{a=run;b=run+v;run=b;}return {l,v,tot,a,b,i};});
  const raw=Math.max(1,...B.map(x=>Math.max(x.a,x.b)))*1.1,cs=atNice(raw/4),hi=cs*Math.ceil(raw/cs),lo=Math.min(0,cs*Math.floor(Math.min(0,...B.map(x=>Math.min(x.a,x.b)))/cs));
  const W=window.innerWidth<1100?760:1000,H=330,L=44,R=12,T=26,BT=58;const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-BT);const n=B.length,slot=(W-L-R)/n,bw=slot*0.62;
  const tk=[];for(let v=lo;v<=hi+1e-9;v+=cs)tk.push(v);
  const col=x=>x.tot?'#1D5FA8':x.l==='GAP'?(x.v<0?'#C2410C':'#15803D'):x.l==='ARRIBA DEL PLAN'?'#E9A23B':x.l==='AUSENTISMO'?'#B42318':'#E9A47F';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cascada de headcount">${tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="gl"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" class="ax">${Math.round(v)}</text>`).join('')}
    ${B.map((x,i)=>{const cx=L+slot*i+slot/2,y1=Y(Math.max(x.a,x.b)),y2=Y(Math.min(x.a,x.b)),h=Math.max(1.5,y2-y1);const words=x.l.split(' ');
      const nx=i<n-1?`<line x1="${(cx+bw/2).toFixed(1)}" x2="${(cx+slot-bw/2).toFixed(1)}" y1="${Y(x.b).toFixed(1)}" y2="${Y(x.b).toFixed(1)}" stroke="rgba(27,36,48,.35)" stroke-dasharray="3 3"/>`:'';
      return `<rect x="${(cx-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col(x)}"><title>${x.l}: ${x.tot?f1(x.v):(x.v>0?'+':'')+f1(x.v)}</title></rect>${nx}
      <text x="${cx.toFixed(1)}" y="${(y1-6).toFixed(1)}" text-anchor="middle" class="lbl" style="font-size:11px">${x.tot?f1(x.v):Math.abs(x.v)<0.05?'0':(x.v>0?'+':'−')+f1(Math.abs(x.v))}</text>
      ${words.map((w,k)=>`<text x="${cx.toFixed(1)}" y="${(H-BT+16+k*12).toFixed(1)}" text-anchor="middle" class="ax" style="font-size:10px;font-weight:700">${w}</text>`).join('')}`;}).join('')}
  </svg>`;}

// ---- gráficas anuales: barras por mes + líneas de meta ----
function atChart(d,area,o){const R=atAll(d,area);const W=window.innerWidth<1100?720:1000,H=o.h||260,L=56,Rr=16,T=24,B=36,n=12;
  const vals=[];R.forEach((r,i)=>{if(!r||!r.prod&&!o.any)return;o.bars.forEach(b=>vals.push(b[2](r,d.months[i])));(o.lines||[]).forEach(l=>vals.push(l[2](r,d.months[i])));});
  if(!vals.length)return '<p class="sub">Sin datos.</p>';
  const raw=Math.max(o.min||0,...vals.filter(isFinite))*1.12||1;const st=atNice(raw/4),hi=st*Math.ceil(raw/st);const Y=v=>T+(1-v/hi)*(H-T-B);const slot=(W-L-Rr)/n,nb=o.bars.length,bw=slot*(nb>1?0.32:0.55);
  const fmt=o.fmt||(v=>f2(v));const ax=o.ax||(v=>Math.abs(v-Math.round(v))<1e-9?nInt(v):String(+v.toFixed(2)));const tk=[];for(let v=0;v<=hi+1e-9;v+=st)tk.push(v);
  const lines=(o.lines||[]).map(([lbl,c,fn,dash])=>{const pts=R.map((r,i)=>r&&(r.prod||o.any)?[L+slot*i+slot/2,Y(fn(r,d.months[i])),i]:null);
    const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else{if(cur.length)segs.push(cur);cur=[];}});if(cur.length)segs.push(cur);
    return segs.map(s=>s.length>1?`<polyline points="${s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.4" ${dash?'stroke-dasharray="6 5"':''}/>`:`<line x1="${(s[0][0]-slot*0.4).toFixed(1)}" x2="${(s[0][0]+slot*0.4).toFixed(1)}" y1="${s[0][1].toFixed(1)}" y2="${s[0][1].toFixed(1)}" stroke="${c}" stroke-width="2.4" ${dash?'stroke-dasharray="6 5"':''}/>`).join('');}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">${tk.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="gl"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" class="ax">${ax(v)}</text>`).join('')}
    ${R.map((r,i)=>{const x0=L+slot*i;return `<text x="${(x0+slot/2).toFixed(1)}" y="${H-B+18}" text-anchor="middle" class="ax" style="font-weight:700">${PC_MONTHS[i].slice(0,3).toUpperCase()}</text>${r&&(r.prod||o.any)?o.bars.map(([lbl,c,fn],k)=>{const v=fn(r,d.months[i]);const x=x0+slot/2-bw*nb/2+bw*k;
      return `<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,H-B-Y(v)).toFixed(1)}" rx="3" fill="${c}"><title>${PC_MONTHS[i]} · ${lbl}: ${fmt(v)}</title></rect>${o.labels!==false&&k===0?`<text x="${(x+bw/2).toFixed(1)}" y="${(Y(v)-5).toFixed(1)}" text-anchor="middle" class="lbl" style="font-size:10px">${fmt(v)}</text>`:''}`;}).join(''):''}`;}).join('')}
    ${lines}</svg>`;}
const atLegend=o=>`<div class="legend" style="margin-top:6px">${o.bars.map(b=>`<span><i style="background:${b[1]}"></i>${b[0]}</span>`).join('')}${(o.lines||[]).map(l=>`<span><i style="background:transparent;border-top:2px ${l[3]?'dashed':'solid'} ${l[1]};height:0;vertical-align:3px"></i>${l[0]}</span>`).join('')}</div>`;
const atBox=(d,area,o)=>`<div class="glass" style="margin-top:16px;padding:20px;border-radius:18px"><b style="font-size:16px">${o.title}</b>${o.sub?`<p class="sub" style="margin:2px 0 0">${o.sub}</p>`:''}<div class="stchart parchart">${atChart(d,area,o)}</div>${atLegend(o)}</div>`;

// ---- campos del mes ----
function atFld(mo,path,lbl,o={}){const v=atGet(mo,path);const miss=o.miss?' miss':'';
  return `<label class="${o.w2?'w2':''}${miss}">${lbl}<input data-atf="${path}" value="${esc(o.int?pcIntFmt(v):(v??''))}" inputmode="decimal" autocomplete="off"${o.int?' data-atint="1"':''}${o.ph?` placeholder="${o.ph}"`:''}>${o.hint?`<small class="athint">${o.hint}</small>`:''}</label>`;}
function atFields(d,mo,area){const m=AT.m;const dm=atDiasMes(d.fy,m);const badD=num(mo.dias)>dm;const pre=area==='mh'?'mh.':'';
  const g=(t,inner,sub)=>`<div class="pcgrp"><b>${t}${sub?` <span class="hint">${sub}</span>`:''}</b><div class="pcgrid">${inner}</div></div>`;
  const af=g('Afectaciones','' + AT_AFECT.map(k=>atFld(mo,pre+'afect.'+k,AT_AFL[k],{int:1})).join(''),'horas-hombre que se restan a las trabajadas · genba, si aplica, en «Otros»');
  if(area==='mh')return `<p class="sub atnote">${svg('list',16,2)} Producción, días, horas por día, JPH, grupos y DST se toman de <b>ensamble</b>.</p>
    ${g('Horas del mes · manejo de materiales',atFld(mo,'mh.horasTrab','Horas trabajadas',{int:1,w2:1}))}${af}
    ${g('Personal · manejo de materiales',atFld(mo,'mh.hcPlan','HC plan (compromiso)')+atFld(mo,'mh.hcRes','HC total del área (real)')+atFld(mo,'mh.sv','SV')+atFld(mo,'mh.lider','Líder')+atFld(mo,'mh.otrosInd','Otros indirectos'),'personas')}`;
  return `${g('Horas del mes',atFld(mo,'horasTrab','Horas trabajadas',{int:1,w2:1})+atFld(mo,'dias','Días trabajados',{miss:badD,hint:badD?PC_MONTHS[m]+' tiene '+dm+' días':''})+atFld(mo,'horasDia','Horas por día',{hint:'22.5 = 2 turnos · 11.25 = 1 turno'}))}
    ${af}
    ${g('Plan (compromiso)',atFld(mo,'hcPlan','HC plan')+atFld(mo,'jphCommit','JPH comprometido')+atFld(mo,'gruposCommit','Grupos comprometidos'),'define la meta (TARGET)')}
    ${g('Resultado real',atFld(mo,'hcRes','HC total del área')+atFld(mo,'jphRes','JPH real')+atFld(mo,'gruposReal','Grupos reales',{ph:'= COMPR.'}),'grupos reales convierten horas en personas')}
    ${g('Indirectos',atFld(mo,'sv','SV')+atFld(mo,'lider','Líder')+atFld(mo,'otrosInd','Otros indirectos'),'personas')}
    ${atIsDSTR(d)?g('DSTR',atFld(mo,'dst','Tiempo estándar de diseño (DST)',{w2:1}),'objetivo ya determinado; al real se le resta la afectación base'):''}`;}

// ---- tarjetas del año (vista general de meses y resumen anual) ----
function atYearKpis(d,area){const R=atAll(d,area);const ok=R.map((r,i)=>[r,i]).filter(([r])=>r&&r.prod);if(!ok.length)return '';
  const sum=k=>ok.reduce((a,[r])=>a+r[k],0);const atY=sum('prod')?sum('trab')*60/sum('prod'):0;const effY=sum('trab')?sum('horasReq')/sum('trab'):0;
  const tgt=ok.filter(([r])=>r.target);const tgtY=tgt.length?tgt.reduce((a,[r])=>a+r.target*r.prod,0)/tgt.reduce((a,[r])=>a+r.prod,0):0;
  const[lm,li]=ok[ok.length-1];
  return `<div class="kpis pck8" style="margin-top:16px">
        <div class="kpi"><span>Actual Time del año</span><span class="v" style="color:${tgtY&&atY>tgtY?'#B42318':'#15803D'}">${f2(atY)}</span><span class="sub">Σ horas trabajadas × 60 ÷ Σ producción</span></div>
        <div class="kpi"><span>Meta del año</span><span class="v">${f2(tgtY)}</span><span class="sub">TARGET ponderado por producción</span></div>
        <div class="kpi"><span>Eficiencia del año</span><span class="v" style="color:var(--blue)">${pc(effY,1)}</span><span class="sub">Σ horas requeridas ÷ Σ trabajadas</span></div>
        <div class="kpi"><span>Producción del año</span><span class="v" style="font-size:28px">${nInt(sum('prod'))}</span><span class="sub">${ok.length} mes${ok.length!==1?'es':''}</span></div>
        <div class="kpi"><span>Actual Time · ${PC_MONTHS[li]}</span><span class="v" style="color:${lm.target&&lm.atReal>lm.target?'#B42318':'#15803D'}">${f2(lm.atReal)}</span><span class="sub">meta ${f2(lm.target)} · sin afectación ${f2(lm.atSA)}</span></div>
        <div class="kpi"><span>GAP de personal · ${PC_MONTHS[li]}</span><span class="v" style="color:${lm.gap>0?'var(--orange)':lm.gap<0?'#B42318':'#15803D'}">${lm.gap>0?'+':''}${f1(lm.gap)}</span><span class="sub">operadores ${f1(lm.res2)} vs requeridos ${f1(lm.hcReq)}</span></div>
        <div class="kpi"><span>${lm.dif<0?'Ausentismo':'Arriba del plan'} · ${PC_MONTHS[li]}</span><span class="v" style="color:${lm.dif<0?'#B42318':'var(--orange)'}">${lm.dif<0?'−':'+'}${f1(Math.abs(lm.dif))}</span><span class="sub">HC trabajado ${f1(lm.hcTrab)} vs plan ${f1(lm.hcPlan)}</span></div>
        ${atIsDSTR(d)?`<div class="kpi"><span>DSTR · ${PC_MONTHS[li]}</span><span class="v" style="color:${lm.dstrObj&&lm.dstrReal>lm.dstrObj?'#B42318':'#15803D'}">${f2(lm.dstrReal)}</span><span class="sub">objetivo ${f2(lm.dstrObj)}</span></div>`
          :atIsJPMH(d)?`<div class="kpi"><span>JPMH · ${PC_MONTHS[li]}</span><span class="v" style="color:${lm.jpmh<lm.jpmhCommit?'#B42318':'#15803D'}">${f2(lm.jpmh)}</span><span class="sub">compromiso ${f2(lm.jpmhCommit)}</span></div>`
          :`<div class="kpi"><span>Forecast · ${PC_MONTHS[li]}</span><span class="v">${f2(lm.forecast)}</span><span class="sub">(60 ÷ JPH real) × HC ÷ grupos</span></div>`}
      </div>`;}
// ---- vista principal ----
function vAT(){

    <div class="pcmonths atmonths" role="list" aria-label="Meses del año fiscal">${PC_MONTHS.map((nm,i)=>{const r=R[i];const over=r&&r.target&&r.atReal>r.target;return `<button type="button" role="listitem" class="pcm ${r&&r.prod?'ok':''}" data-atm="${i}" aria-label="${atMonthLbl(d,i)}"><b>${nm.slice(0,3).toUpperCase()}</b><small class="mono" ${r&&r.prod?`style="color:${over?'#B42318':'#15803D'}"`:''}>${r&&r.prod?f1(r.atReal):d.months[i]?'incompleto':'—'}</small></button>`;}).join('')}</div>
    ${n?`<p class="mmlbl" style="margin:18px 0 0">Acumulado del año</p>${atYearKpis(d,area)}`:`<div class="slot empty" style="min-height:180px;margin-top:16px"><b style="font-size:17px">Aún no hay meses capturados</b><p>Toca un mes para empezar. Cada mes se captura una vez, al cierre.</p>${d.months.every(x=>!x)?`<button class="btn ghost" type="button" data-atexample="1">Cargar ejemplo (5 meses)</button>`:''}</div>`}
    <div class="pcbottom"><button class="btn ghost" type="button" data-atv="info">${svg('back',18,2.2)} Información</button><button class="btn" type="button" data-atv="res">Resumen anual ${svg('next',18,2.2)}</button></div>`;
  }
  else if(AT.view==='mes'){const m=AT.m;const mo=d.months[m];const area=AT.area;
    const prev=(()=>{for(let i=m-1;i>=0;i--)if(d.months[i])return i;return -1;})();
    const src=mo&&atPcSrc(d,m);
    body=`<div class="row"><div><button type="button" class="btn ghost sm atback" data-atmall="1">${svg('back',16,2.2)} Todos los meses</button><h2 style="margin-top:10px">${atMonthLbl(d,m)}</h2><p class="sub">${mo?esc(atTipo(d))+(atHasMH(d)?' + manejo de materiales':'')+' · se captura al cierre del mes':'Mes sin capturar'}</p></div>${atAreaSeg(d)}</div>
    ${!mo?`<div class="slot empty" style="min-height:200px;margin-top:16px"><b style="font-size:17px">${PC_MONTHS[m]} sin capturar</b><p>${prev>=0?`Copia <b>${PC_MONTHS[prev]}</b> (partes, plan y personal) y cambia solo lo que se movió.`:'Captura las partes, las horas y el personal del mes.'}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${prev>=0?`<button class="btn" type="button" data-atcopy="${prev}">Copiar de ${PC_MONTHS[prev]}</button>`:''}<button class="btn ghost" type="button" data-atstart="1">${svg('plus',18,2.2)} Empezar en blanco</button></div></div>`
    :`<div data-atlive="1" style="margin-top:16px">${atKpis(d,atR(mo,area),area)}</div>
    <div class="pcgrp" style="margin-top:18px"><b>Números de parte <span class="hint">cada parte aporta sus horas requeridas = producción × ${area==='mh'?'LAT':atTimeLbl(d.tipo)} ÷ 60</span></b>${atPartRows(d,mo,area)}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" type="button" data-atpadd="1">${svg('plus',16,2.2)} Agregar parte</button>${src?`<button class="btn ghost sm" type="button" data-atpc="1">Traer LAT de Cálculo de personal</button>`:''}</div></div>
    <div class="pcbody atbody">${atFields(d,mo,area)}</div>
    <div class="glass" style="margin-top:16px;padding:20px;border-radius:18px"><div class="row"><div><b style="font-size:16px">Cascada de headcount${atHasMH(d)?' · '+atAreaLbl(area).toLowerCase():''}</b><p class="sub" style="margin:2px 0 0">Horas convertidas a personas equivalentes: días × horas por día ÷ grupos reales = <span data-athper="1">${f2(atR(mo,area).hPer)}</span> h por persona</p></div></div>
      <div class="stchart parchart" data-atcasc="1">${atCasc(atR(mo,area))}</div></div>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">${prev>=0?`<button class="btn ghost sm" type="button" data-atcopy="${prev}" data-atask="1">Reemplazar con ${PC_MONTHS[prev]}</button>`:''}<button class="btn ghost sm" type="button" data-atclear="1">Borrar mes</button></div>`}
    <div class="pcbottom"><button class="btn ghost" type="button" data-atmall="1">${svg('back',18,2.2)} Todos los meses</button>${!mo?'':atHasMH(d)&&area==='ens'?`<button class="btn" type="button" data-atarea="mh" data-attop="1">Siguiente: manejo de materiales ${svg('next',18,2.2)}</button>`:`<div style="display:flex;gap:10px;flex-wrap:wrap">${atHasMH(d)?`<button class="btn ghost" type="button" data-atarea="ens" data-attop="1">${svg('back',18,2.2)} Ensamble</button>`:''}<button class="btn orange" type="button" data-atsave="1">Guardar ${PC_MONTHS[m].toLowerCase()} ${svg('next',18,2.2)}</button></div>`}</div>`;
  }
  if(AT.view==='res'){const area=AT.area;const R=atAll(d,area);const ok=R.map((r,i)=>[r,i]).filter(([r])=>r&&r.prod);const tl=area==='mh'?'LAT':atTimeLbl(d.tipo);
    body=`<div class="row"><div><h2>Resumen anual · FY${String(d.fy).padStart(2,'0')}</h2><p class="sub">${ud(d.nombre)} · ${esc(atTipo(d))}${atHasMH(d)?' · '+atAreaLbl(area).toLowerCase():''} · ${ok.length} de 12 meses capturados</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${atAreaSeg(d)}${pdfBig('at')}${del}<button class="btn ghost" type="button" data-atv="mes">${svg('back',18,2.2)} Meses</button><button class="btn orange" type="button" data-atfinish="1">Guardar</button></div></div>
    ${!ok.length?`<div class="slot empty" style="min-height:160px;margin-top:16px"><p>Captura al menos un mes para ver el resumen.</p></div>`:(()=>{
      const sum=k=>ok.reduce((a,[r])=>a+r[k],0);const atY=sum('prod')?sum('trab')*60/sum('prod'):0;const effY=sum('trab')?sum('horasReq')/sum('trab'):0;
      const tgt=ok.filter(([r])=>r.target);const tgtY=tgt.length?tgt.reduce((a,[r])=>a+r.target*r.prod,0)/tgt.reduce((a,[r])=>a+r.prod,0):0;
      const[lm,li]=ok[ok.length-1];const cm=AT.cm!=null&&R[AT.cm]&&R[AT.cm].prod?AT.cm:li;const cr=R[cm];
      const AF='#C2410C',SA='#E9A47F',TG='#1D5FA8';
      return `${atYearKpis(d,area)}
      ${atBox(d,area,{title:'Actual Time'+(atHasMH(d)?' · '+atAreaLbl(area).toLowerCase():''),sub:'Minutos-hombre por pieza contra la meta · abajo es mejor',bars:[['Con afectación',AF,r=>r.atReal],['Sin afectación',SA,r=>r.atSA]],lines:[['Meta (TARGET)',TG,r=>r.target,1]]})}
      <div class="glass" style="margin-top:16px;padding:20px;border-radius:18px"><div class="row"><div><b style="font-size:16px">Cascada de headcount · ${PC_MONTHS[cm]}</b><p class="sub" style="margin:2px 0 0">Del plan al HC requerido, en personas equivalentes</p></div></div>
        <div class="chips" style="margin-top:10px" role="group" aria-label="Mes">${ok.map(([r,i])=>`<button type="button" class="chip sm" data-atcm="${i}" aria-pressed="${i===cm}">${PC_MONTHS[i].slice(0,3).toUpperCase()}</button>`).join('')}</div>
        <div class="stchart parchart">${atCasc(cr)}</div></div>
      ${atBox(d,area,{title:'Eficiencia',sub:'Horas requeridas ÷ horas trabajadas · arriba es mejor',bars:[['Eficiencia',AF,r=>r.efic*100],['Sin afectación',SA,r=>r.eficSA*100]],lines:[['Compromiso 100 %',TG,()=>100,1]],fmt:v=>f1(v)+'%',ax:v=>Math.round(v)+'%',min:100})}
      ${atBox(d,area,{title:'Horas trabajadas vs requeridas',bars:[['Trabajadas','#A7B0BA',r=>r.trab],['Requeridas','#1D5FA8',r=>r.horasReq]],fmt:v=>nInt(v),labels:false})}
      ${area==='ens'?atBox(d,area,{title:'Producción mensual',sub:'Piezas · arriba es mejor',bars:[['Producción','#3E7BC4',r=>r.prod]],fmt:v=>nInt(v)}):''}
      ${area==='ens'?atBox(d,area,{title:'JPH real vs comprometido',bars:[['JPH real','#1D5FA8',(r,m)=>num(m.jphRes)]],lines:[['JPH comprometido','#C2410C',(r,m)=>num(m.jphCommit),1]],fmt:v=>f1(v)}):''}
      ${atIsDSTR(d)?atBox(d,area,{title:'DSTR'+(atHasMH(d)?' · '+atAreaLbl(area).toLowerCase():''),sub:'Actual Time ÷ tiempo estándar de diseño · abajo es mejor',bars:[['Real (con afectación)',AF,r=>r.dstrReal],['Real (sin afectación)',SA,r=>r.dstrRealSA]],lines:[['Objetivo',TG,r=>r.dstrObj,1]]}):''}
      ${atIsJPMH(d)?atBox(d,area,{title:'JPMH',sub:'Piezas por hora-hombre de un grupo · arriba es mejor',bars:[['JPMH real','#1D5FA8',r=>r.jpmh]],lines:[['Compromiso','#C2410C',r=>r.jpmhCommit,1]]}):''}
      <div class="tbl smtbl"><table><thead><tr><th style="text-align:left">Mes</th><th>Producción</th><th>Horas req.</th><th>Horas trab.</th><th>${tl} pond.</th><th>Eficiencia</th><th>Sin afect.</th><th>Actual Time</th><th>Sin afect.</th><th>Meta</th><th>HC trabajado</th><th>Operadores</th><th>HC req.</th><th>GAP</th>${atIsDSTR(d)?'<th>DSTR</th><th>DSTR obj.</th>':''}${atIsJPMH(d)?'<th>JPMH</th><th>JPMH compr.</th>':''}</tr></thead><tbody>
        ${ok.map(([r,i])=>`<tr><th>${atMonthLbl(d,i)}</th><td>${nInt(r.prod)}</td><td>${nInt(r.horasReq)}</td><td>${nInt(r.trab)}</td><td>${f2(r.st)}</td><td>${pc(r.efic,1)}</td><td>${pc(r.eficSA,1)}</td><td style="color:${r.target&&r.atReal>r.target?'#B42318':'#15803D'}"><b>${f2(r.atReal)}</b></td><td>${f2(r.atSA)}</td><td>${f2(r.target)}</td><td>${f1(r.hcTrab)}</td><td>${f1(r.res2)}</td><td>${f1(r.hcReq)}</td><td style="color:${r.gap>0?'var(--orange)':'#B42318'}">${r.gap>0?'+':''}${f1(r.gap)}</td>${atIsDSTR(d)?`<td>${f2(r.dstrReal)}</td><td>${f2(r.dstrObj)}</td>`:''}${atIsJPMH(d)?`<td>${f2(r.jpmh)}</td><td>${f2(r.jpmhCommit)}</td>`:''}</tr>`).join('')}
      </tbody></table></div>`;})()}`;
  }
  return `${atSteps()}<section class="glass panel ${S.keep?'':'view'}">${body}</section>`;
}
// ---- eventos ----
const atRe=()=>{S.keep=true;render(true);S.keep=false;};
function atSync(){const f=document.getElementById('ath');if(f&&AT.d)new FormData(f).forEach((v,k)=>AT.d[k]=v);}
function atLive(){const d=AT.d;const mo=d&&AT.m!=null&&d.months[AT.m];if(!mo)return;const r=atR(mo,AT.area);
  const set=(sel,h)=>{const e=document.querySelector(sel);if(e)e.innerHTML=h;};
  set('[data-atlive]',atKpis(d,r,AT.area));set('[data-atcasc]',atCasc(r));set('[data-athper]',f2(r.hPer));
  mo.partes.forEach((p,i)=>{set(`[data-atph="${p.id}"]`,h2(r.partes[i].horasReq));set(`[data-atpp="${p.id}"]`,pc(r.partes[i].pct,1));});
  set('[data-atpt="prod"]',nInt(r.prod));set('[data-atpt="req"]',h2(r.horasReq));
  const mb=document.querySelector(`[data-atm="${AT.m}"] small`);if(mb)mb.textContent=r.prod?f1(r.atReal):'—';
  const di=document.querySelector('[data-atf="dias"]');if(di){const dm=atDiasMes(d.fy,AT.m),bad=num(mo.dias)>dm;const lb=di.closest('label');lb.classList.toggle('miss',bad);let h=lb.querySelector('.athint');if(bad){if(!h){h=document.createElement('small');h.className='athint';lb.appendChild(h);}h.textContent=PC_MONTHS[AT.m]+' tiene '+dm+' días';}else if(h)h.remove();}}
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('button');if(!t||t.disabled)return;const D=t.dataset;
  if(D.atnew){atNew();go('at-nuevo');return;}
  if(D.atopen){AT.d=AT.studies.find(x=>x.id==D.atopen);AT.view=AT.d.months.some(Boolean)?'res':'info';AT.m=null;AT.area='ens';AT.cm=null;AT.miss=[];go('at-nuevo');return;}
  const d=AT.d;if(!d||!Object.keys(D).some(k=>k.startsWith('at')))return;
  if(D.atv){atSync();if(D.atneed){AT.miss=String(d.nombre||'').trim()?[]:['nombre'];if(AT.miss.length){atRe();return;}if(!AT.studies.includes(d))AT.studies.unshift(d);
}
    if(D.atv==='mes')AT.m=null;AT.view=D.atv;render();return;}
  if(D.attipo){atSync();d.tipo=D.attipo;atRe();return;}
  if(D.atmh!==undefined){atSync();d.mh=D.atmh==='1';atRe();return;}

  if(D.atpadd){const ps=d.months[AT.m].partes;const np=atNewPart();np.lat=ps.length?ps[0].lat:'';ps.push(np);atRe();const ins=document.querySelectorAll('[data-atp$="|parte"]');if(ins.length)ins[ins.length-1].focus({preventScroll:false});return;}

// ===== EFICIENCIA COMPUESTA · vista general de planta (sin captura) =====
// Lee los Actual Time de un año fiscal. Ensamble + manejo de materiales = una sola área; maquinado y fundición, cada uno aparte.
// Sin reparto de áreas sin producción y sin genba. Inventario y pre-arranque se capturan en afectaciones «otros» del Actual Time.
// Requiere atcalc.js.
function ecArea(st,m){const mo=st.months[m];if(!mo)return null;const a=atMonth(mo);if(!a.prod)return null;
  let req=a.horasReq,trab=a.trab,afect=a.afect;
  if(st.tipo==='ENSAMBLE'&&st.mh){const b=atMH(mo);req+=b.horasReq;trab+=b.trab;afect+=b.afect;}
  return {req,trab,afect,prod:a.prod,efic:trab?req/trab:0,eficSA:trab-afect>0?req/(trab-afect):0,vol:trab?a.prod/trab:0};}
// prev = Actual Time del año fiscal anterior (misma área) para comparar abril contra marzo pasado
function ecSeries(st,prev){const s=PC_MONTHS.map((_,m)=>ecArea(st,m));const base=prev?ecArea(prev,11):null;
  s.forEach((x,m)=>{if(!x)return;let p=null;for(let i=m-1;i>=0;i--)if(s[i]){p=s[i];break;}if(!p&&m===0)p=base;
    x.dEfic=p?x.efic-p.efic:null;x.dEficSA=p?x.eficSA-p.eficSA:null;x.dVol=p&&p.vol?x.vol/p.vol-1:null;});
  return {months:s,base};}
// planta: suma de horas de todas las áreas (ponderado), no promedio de porcentajes
function ecPlant(list){return PC_MONTHS.map((_,m)=>{let req=0,trab=0,afect=0,n=0;
  list.forEach(L=>{const x=L.months[m];if(x){req+=x.req;trab+=x.trab;afect+=x.afect;n++;}});
  return n?{req,trab,afect,n,efic:req/trab,eficSA:trab-afect>0?req/(trab-afect):0}:null;});}
function ecYear(months){let req=0,trab=0,afect=0;months.forEach(x=>{if(x){req+=x.req;trab+=x.trab;afect+=x.afect;}});return trab?{req,trab,afect,efic:req/trab,eficSA:trab-afect>0?req/(trab-afect):0}:null;}

function ecLines(D,key){const W=window.innerWidth<1100?720:1000,H=300,L=52,R=16,T=20,B=34,n=12;const slot=(W-L-R)/n;
  const vals=[];D.list.forEach(A=>A.months.forEach(x=>x&&vals.push(x[key])));D.plant.forEach(x=>x&&vals.push(x[key]));if(!vals.length)return '';
  const lo0=Math.min(...vals),hi0=Math.max(...vals);const st=atNice(Math.max(0.02,(hi0-lo0))/4);const lo=Math.max(0,st*Math.floor((lo0-st*0.3)/st)),hi=st*Math.ceil((hi0+st*0.3)/st);
  const X=i=>L+slot*i+slot/2,Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);const tk=[];for(let v=lo;v<=hi+1e-9;v+=st)tk.push(v);

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trayectoria de eficiencia por área">${tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="gl"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" class="ax">${+(v*100).toFixed(1)}%</text>`).join('')}

// ===== DIAGRAMA DE FLUJO DE PROCESO · símbolos ASME (lógica pura) =====
// Nodo: {id, t, desc, resp, tiempo, dist, next, yes, no}. Posiciones en cuadrícula: lay = {rows, cols, pos:{id:[fila,col]}}
const DF_SYM={
  ini:{n:'Inicio / fin',sum:false},
  op:{n:'Operación',sum:true,va:true},
  insp:{n:'Inspección',sum:true},
  tra:{n:'Transporte',sum:true},
  dem:{n:'Demora',sum:true},
  alm:{n:'Almacenamiento',sum:true},
  dec:{n:'Decisión',sum:false}
};
const DF_ORDER=['op','insp','tra','dem','alm'];   // orden del resumen ASME
const dfIsDec=n=>n&&n.t==='dec';
const dfOuts=n=>dfIsDec(n)?[['yes','SÍ'],['no','NO']]:[['next','']];
function dfNode(t){return {id:nid(),t,desc:'',resp:'',tiempo:'',dist:'',next:null,yes:null,no:null};}
function dfGet(d,id){return d.nodes.find(n=>n.id==id);}
function dfUsed(lay,r,c){return Object.values(lay.pos).some(p=>p[0]===r&&p[1]===c);}
// Agrega un símbolo en una casilla; si viene de otro símbolo, lo conecta por la salida indicada (next / yes / no)
function dfAdd(d,t,cell,from,out){const n=dfNode(t);d.nodes.push(n);d.lay.pos[n.id]=cell.slice();dfGrow(d.lay,cell);
  if(from!=null){const f=dfGet(d,from);if(f)f[out||'next']=n.id;}return n;}
function dfGrow(lay,cell){lay.rows=Math.max(lay.rows,cell[0]+1);lay.cols=Math.max(lay.cols,cell[1]+1);}
// Casilla libre sugerida para la salida de un símbolo: SÍ / siguiente abajo, NO a la derecha (si no se puede, a la izquierda)
function dfSlot(d,id,out){const p=d.lay.pos[id];if(!p)return null;const[r,c]=p;
  const cands=out==='no'?[[r,c+1],[r,c-1],[r+1,c+1]]:[[r+1,c],[r,c+1],[r+1,c+1],[r,c-1]];
  for(const[a,b]of cands){if(a<0||b<0)continue;if(!dfUsed(d.lay,a,b))return [a,b];}
  return null;}
// Salidas abiertas de un símbolo (sin conectar). El último «Inicio / fin» sin salida es el fin del proceso.
function dfOpen(d,n){if(n.t==='ini'&&dfIncoming(d,n.id).length)return [];return dfOuts(n).filter(([k])=>n[k]==null).map(([k])=>k);}
function dfIncoming(d,id){const r=[];d.nodes.forEach(n=>dfOuts(n).forEach(([k])=>{if(n[k]==id)r.push([n.id,k]);}));return r;}
function dfEdges(d){const e=[];d.nodes.forEach(n=>dfOuts(n).forEach(([k,l])=>{if(n[k]!=null&&dfGet(d,n[k]))e.push({from:n.id,to:n[k],out:k,label:l});}));return e;}
function dfRemove(d,id){d.nodes=d.nodes.filter(n=>n.id!=id);d.nodes.forEach(n=>['next','yes','no'].forEach(k=>{if(n[k]==id)n[k]=null;}));delete d.lay.pos[id];}
function dfMoveTo(lay,id,cell){lay.pos[id]=cell.slice();dfGrow(lay,cell);}
function dfSwap(lay,a,b){const t=lay.pos[a];lay.pos[a]=lay.pos[b];lay.pos[b]=t;}
// Inicio del proceso: el primer «Inicio / fin» sin entradas; si no hay, el primer símbolo sin entradas
function dfStart(d){const noIn=d.nodes.filter(n=>!dfIncoming(d,n.id).length);return noIn.find(n=>n.t==='ini')||noIn[0]||d.nodes[0]||null;}
// Orden del proceso: recorrido desde el inicio siguiendo siguiente → SÍ → NO; luego lo que quedó suelto
function dfOrder(d){const seen=new Set(),out=[];const walk=id=>{const n=dfGet(d,id);if(!n||seen.has(n.id))return;seen.add(n.id);out.push(n);dfOuts(n).forEach(([k])=>{if(n[k]!=null)walk(n[k]);});};
  const s=dfStart(d);if(s)walk(s.id);d.nodes.forEach(n=>{if(!seen.has(n.id))walk(n.id);});return out;}
// Resumen ASME: cantidad, tiempo y distancia por símbolo (sin inicio/fin ni decisiones)
function dfSummary(d){const rows=DF_ORDER.map(t=>{const ns=d.nodes.filter(n=>n.t===t);return {t,n:ns.length,tiempo:ns.reduce((a,x)=>a+num(x.tiempo),0),dist:ns.reduce((a,x)=>a+num(x.dist),0)};});
  const act=rows.reduce((a,r)=>a+r.n,0),tiempo=rows.reduce((a,r)=>a+r.tiempo,0),dist=rows.reduce((a,r)=>a+r.dist,0);const op=rows[0];
  return {rows,act,tiempo,dist,dec:d.nodes.filter(dfIsDec).length,pctOp:act?op.n/act:0,pctOpT:tiempo?op.tiempo/tiempo:0};}
// Avisos: símbolos sin acción, decisiones sin sus dos caminos, símbolos sueltos
function dfWarn(d){const w=[];const s=dfStart(d);
  d.nodes.forEach(n=>{if(!String(n.desc).trim())w.push([n.id,'sin acción escrita']);
    if(dfIsDec(n)){if(n.yes==null)w.push([n.id,'decisión sin camino SÍ']);if(n.no==null)w.push([n.id,'decisión sin camino NO']);}
    else if(n.t!=='ini'&&n.next==null)w.push([n.id,'no tiene siguiente paso']);
    if(s&&n!==s&&!dfIncoming(d,n.id).length)w.push([n.id,'nadie llega a este símbolo']);});
  return w;}
// Ruta de la flecha en escuadra (solo tramos horizontales y verticales) entre dos casillas.
// geo: {cx(c), cy(r), W, H, G}. Devuelve los puntos de la polilínea.
function dfPath(a,b,out,g){const[ra,ca]=a,[rb,cb]=b;const ax=g.cx(ca)+g.W/2,ay=g.cy(ra)+g.H/2,bx=g.cx(cb)+g.W/2,by=g.cy(rb)+g.H/2;const hw=g.W/2,hh=g.H/2;
  if(ca===cb&&rb>ra&&out==='no'){const lane=g.cx(ca)+g.W+g.G/2;return [[ax+hw,ay],[lane,ay],[lane,by],[bx+hw,by]];}   // NO hacia abajo: rodea por la derecha
  if(ca===cb&&rb>ra)return [[ax,ay+hh],[bx,by-hh]];                             // abajo en la misma columna
  if(ra===rb&&cb!==ca){const s=cb>ca?1:-1;return [[ax+s*hw,ay],[bx-s*hw,by]];}   // misma fila
  if(rb>ra){if(out==='no'){const s=cb>ca?1:-1;return [[ax+s*hw,ay],[bx,ay],[bx,by-hh]];}   // NO: primero de lado y luego baja
    const my=g.cy(ra)+g.H+g.G/2;return [[ax,ay+hh],[ax,my],[bx,my],[bx,by-hh]];}           // baja, cruza y entra por arriba
  // regreso hacia arriba (retrabajo): sale por la derecha, sube por el pasillo y entra por la derecha
  const lane=Math.max(g.cx(ca),g.cx(cb))+g.W+g.G/2;return [[ax+hw,ay],[lane,ay],[lane,by],[bx+hw,by]];}

const DF={studies:[],d:null,view:'info',sel:null,last:null,focus:false,miss:[]};

function dfNewStudy(){DF.d={id:nid(),ubic:{},titulo:'',proceso:'',area:'',analista:'',fecha:hoyLocal(new Date()),metodo:'ACTUAL',nodes:[],lay:{rows:5,cols:4,pos:{}}};DF.view='info';DF.sel=null;DF.last=null;DF.miss=[];}
// Símbolo ASME dibujado en (x, y) = centro
function dfShape(t,x,y,k){k=k||1;const s=v=>(v*k).toFixed(1);const X=v=>(x+v*k).toFixed(1),Y=v=>(y+v*k).toFixed(1);
  if(t==='op')return `<circle cx="${x}" cy="${y}" r="${s(19)}" class="dfs op"/>`;
  if(t==='insp')return `<rect x="${X(-17)}" y="${Y(-17)}" width="${s(34)}" height="${s(34)}" class="dfs insp"/>`;
  if(t==='tra')return `<path d="M${X(-22)},${Y(-9)} H${X(4)} V${Y(-18)} L${X(22)},${Y(0)} L${X(4)},${Y(18)} V${Y(9)} H${X(-22)} Z" class="dfs tra"/>`;
  if(t==='dem')return `<path d="M${X(-17)},${Y(-17)} H${X(0)} A${s(17)},${s(17)} 0 0 1 ${X(0)},${Y(17)} H${X(-17)} Z" class="dfs dem"/>`;
  if(t==='alm')return `<path d="M${X(-20)},${Y(-16)} H${X(20)} L${X(0)},${Y(18)} Z" class="dfs alm"/>`;
  if(t==='dec')return `<path d="M${X(0)},${Y(-21)} L${X(24)},${Y(0)} L${X(0)},${Y(21)} L${X(-24)},${Y(0)} Z" class="dfs dec"/>`;
  return `<rect x="${X(-30)}" y="${Y(-14)}" width="${s(60)}" height="${s(28)}" rx="${s(14)}" class="dfs ini"/>`;}

function dfWrap(s,n){const w=String(s||'').split(/\s+/);const L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>n&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim();});
  if(L.length>2){L.length=2;L[1]=L[1].slice(0,n-1)+'…';}return L;}
// Hoja en blanco: cuadrícula invisible (los símbolos se acomodan solos), flechas en escuadra y símbolos
const DFG={CW:150,CH:112,G:58,P:24};
function dfFit(d){const ps=Object.values(d.lay.pos);const mr=ps.length?Math.max(...ps.map(p=>p[0])):-1,mc=ps.length?Math.max(...ps.map(p=>p[1])):-1;
  d.lay.rows=Math.max(window.innerWidth<=700?5:4,mr+2);d.lay.cols=Math.max(window.innerWidth<=700?2:4,mc+2);}
function dfSvg(d,o){o=o||{};const ro=!!o.ro;const L=d.lay;const{CW,CH,G,P}=DFG;
  if(!ro)dfFit(d);const ps=Object.values(L.pos);const rows=ro?Math.max(1,...ps.map(p=>p[0]+1)):L.rows,cols=ro?Math.max(1,...ps.map(p=>p[1]+1)):L.cols;
  const back=dfEdges(d).some(e=>{const A=L.pos[e.from],B=L.pos[e.to];return A&&B&&B[0]<A[0];});
  const W=P*2+cols*CW+(cols-1)*G+(back?G:0),H=P*2+rows*CH+(rows-1)*G;const cx=c=>P+c*(CW+G),cy=r=>P+r*(CH+G);const g={cx,cy,W:CW,H:CH,G};
  const ord=dfOrder(d);const no={};ord.forEach((n,i)=>no[n.id]=i+1);
  const arrows=dfEdges(d).map(e=>{const a=L.pos[e.from],b=L.pos[e.to];if(!a||!b)return '';const P_=dfPath(a,b,e.out,g);const p0=P_[0],p1=P_[1];
    const lx=p0[0]+(p1[0]===p0[0]?10:(p1[0]>p0[0]?8:-8)),ly=p0[1]+(p1[1]===p0[1]?-8:16);
    return `<polyline points="${P_.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" class="dfarrow ${e.out}" marker-end="url(#dfah)"/>${e.label?`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${p1[0]<p0[0]?'end':'start'}" class="dfel ${e.out}">${e.label}</text>`:''}`;}).join('');
  const boxes=d.nodes.map(n=>{const p=L.pos[n.id];if(!p)return '';const x=cx(p[1]),y=cy(p[0]);const on=!ro&&DF.sel===n.id;const lines=dfWrap(n.desc||'',17);const empty=!String(n.desc).trim();
    const meta=[num(n.tiempo)?fT(num(n.tiempo))+' min':'',n.t==='tra'&&num(n.dist)?fT(num(n.dist))+' m':''].filter(Boolean).join(' · ');
    return `<g class="dfbox ${on?'on':''} ${empty?'empty':''}" ${ro?'':`data-dfbox="${n.id}" tabindex="0" role="button"`} aria-label="${esc(DF_SYM[n.t].n)} ${no[n.id]||''}: ${esc(n.desc||'sin acción')}"><title>${no[n.id]||''}. ${esc(DF_SYM[n.t].n)}: ${esc(n.desc||'sin acción')}${n.resp?' · '+esc(n.resp):''}</title>
      <rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="14"/><text x="${x+10}" y="${y+17}" class="dfnum">${no[n.id]||''}</text>
      ${dfShape(n.t,x+CW/2,y+30)}
      ${(empty?[ro?'—':'ESCRIBE LA ACCIÓN']:lines).map((l,i)=>`<text x="${x+CW/2}" y="${y+68+i*14}" text-anchor="middle" class="dfdesc ${empty?'ph':''}">${esc(l)}</text>`).join('')}
      ${meta?`<text x="${x+CW/2}" y="${y+CH-8}" text-anchor="middle" class="dfmeta">${meta}</text>`:''}</g>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="min-width:${ro?Math.round(W*0.7):Math.min(W,window.innerWidth<=700?W*0.62:720)}px" ${ro?'':'data-dfsvg="1"'} role="img" aria-label="Diagrama de flujo del proceso">
    <defs><marker id="dfah${ro?'r':''}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker>
    ${ro?'':'<pattern id="dfdots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#C9D1DA"/></pattern>'}</defs>
    ${ro?'':`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#dfdots)" data-dfsheet="1"/>`}${(ro?arrows.replace(/url\(#dfah\)/g,'url(#dfahr)'):arrows)}${boxes}</svg>`;}
// Convierte un punto de la pantalla a la casilla más cercana de la hoja
function dfCellAt(svg,x,y){const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const q=pt.matrixTransform(svg.getScreenCTM().inverse());const{CW,CH,G,P}=DFG;
  return [Math.max(0,Math.round((q.y-P-CH/2)/(CH+G))),Math.max(0,Math.round((q.x-P-CW/2)/(CW+G)))];}
function dfNearFree(L,cell,skip){const free=(r,c)=>r>=0&&c>=0&&!Object.entries(L.pos).some(([id,p])=>id!=skip&&p[0]===r&&p[1]===c);if(free(cell[0],cell[1]))return cell;
  for(let k=1;k<12;k++)for(const[a,b]of[[k,0],[0,k],[0,-k],[-k,0],[k,k],[k,-k],[-k,k],[-k,-k]])if(free(cell[0]+a,cell[1]+b))return [cell[0]+a,cell[1]+b];return [cell[0]+12,cell[1]];}
// Antecesor por defecto: el último símbolo que se puso, si todavía tiene una salida libre
function dfDefPrev(d){const n=DF.last&&dfGet(d,DF.last);if(!n)return null;const o=dfOpen(d,n);return o.length?[n.id,o[0]]:null;}
function dfPlace(d,t,cell){const prev=dfDefPrev(d);const n=dfAdd(d,t,dfNearFree(d.lay,cell),prev?prev[0]:null,prev?prev[1]:null);DF.last=n.id;DF.sel=n.id;DF.focus=true;return n;}
function dfAutoCell(d){const prev=dfDefPrev(d);if(prev){const c=dfSlot(d,prev[0],prev[1]);if(c)return c;}
  if(!d.nodes.length)return [0,0];const ps=Object.values(d.lay.pos);return [Math.max(...ps.map(p=>p[0]))+1,0];}

function dfPop(d){const n=DF.sel&&dfGet(d,DF.sel);if(!n)return '';const ord=dfOrder(d);const no={};ord.forEach((x,i)=>no[x.id]=i+1);

// ===== TAKT Y BALANCEO DE LÍNEA · el ritmo del cliente contra el tiempo ciclo de cada estación =====
// Así lo trabaja Angel en piso: un Work Element por estación (uno por operador); el conjunto muestra el balanceo de la línea
// y se mueven elementos entre estaciones hasta que ninguna pase del takt. Aquí se juntan, se comparan contra el takt y se simula.
// <tk-pure> Funciones puras: se prueban en Node (parts/tktest.js) leyendo este bloque directo de index.html.
function tkNum(v){const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?0:x;}
// Demanda en piezas: la coma es separador de miles (1,200 = 1200), como en dinero.
function tkDem(v){const x=parseFloat(String(v??'').replace(/,/g,''));return isNaN(x)?0:x;}
// Minutos disponibles por día = turnos × (minutos por turno − paros programados por turno: comida, breaks, juntas, TPM)
function tkDisp(d){return Math.max(0,tkNum(d.turnos)*(tkNum(d.minTurno)-tkNum(d.paros)));}
// Takt = minutos disponibles ÷ demanda diaria (minutos por pieza)
function tkTakt(d){const D=tkDem(d.demanda);return D>0?tkDisp(d)/D:0;}
// Balanceo: tiempo ciclo de cada estación = Σ tiempos de sus elementos (min por pieza).
// key = 'st' (como quedó en la simulación) o 'st0' (como se trajo de los estudios).
function tkCalc(stations,els,o){o=o||{};const key=o.key||'st',takt=+o.takt||0,disp=+o.disp||0,dem=+o.dem||0;
  const rows=stations.map(s=>{const items=els.filter(e=>e[key]===s.id);const tc=items.reduce((a,e)=>a+tkNum(e.t),0);
    return {id:s.id,nombre:s.nombre,items,tc,pct:takt?tc/takt:0,over:takt>0&&tc>takt+1e-9};});
  const n=rows.length,total=rows.reduce((a,r)=>a+r.tc,0);
  let bott=null;rows.forEach(r=>{if(!bott||r.tc>bott.tc+1e-12)bott=r;});const max=bott?bott.tc:0;
  const personal=takt?total/takt:0;
  return {rows,n,total,max,bott:max>0?bott:null,
    eff:n&&max?total/(n*max):0,          // eficiencia de balanceo = Σ TC ÷ (estaciones × TC del cuello de botella)
    cap:max?60/max:0,                    // capacidad teórica (pzs/h): la línea no va más rápido que su cuello de botella
    capDia:max?disp/max:0,               // piezas posibles por día con el tiempo disponible
    cumple:max>0&&dem>0&&disp/max>=dem-1e-9,
    over:rows.filter(r=>r.over).length,  // estaciones arriba del takt
    personal,                            // personal teórico = Σ TC ÷ takt
    minEst:takt?Math.ceil(personal-1e-9):0};}
// Las estaciones «de antes» son las que se trajeron o capturaron; las agregadas en el balanceo son para simular.
function tkBefore(st){return st.filter(s=>!s.nueva);}
// </tk-pure>

// ---- eventos Takt y balanceo ----
const tkRe=()=>{S.keep=true;render(true);S.keep=false;};
function tkSync(){['tkh','tkh2'].forEach(id=>{const f=document.getElementById(id);if(f&&TK.d)new FormData(f).forEach((v,k)=>TK.d[k]=v);});}
function tkMiss(d){const m=[];if(!String(d.analista||'').trim())m.push('analista');if(!(tkDem(d.demanda)>0))m.push('demanda');if(!(tkNum(d.turnos)>0))m.push('turnos');if(!(tkNum(d.minTurno)>tkNum(d.paros)))m.push('minTurno');return m;}
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('mback'))return;
  const t=e.target.closest('button');if(!t||t.disabled)return;const D=t.dataset;
  if(D.tknew){tkNew();go('tk-nuevo');return;}
  if(D.tkopen){TK.d=TK.studies.find(x=>x.id==D.tkopen);TK.view=TK.d.els.length?'res':'info';TK.sel=null;TK.miss=[];go('tk-nuevo');return;}
  const d=TK.d;if(!d||!Object.keys(D).some(k=>k.startsWith('tk')))return;
  if(D.tkv){tkSync();if(D.tkneed||(TK.view==='info'&&D.tkv!=='info')){TK.miss=tkMiss(d);if(TK.miss.length){tkRe();return;}
      if(!d.titulo){const ln=d.ubic&&ubFind('linea',d.ubic.linea);d.titulo=ln?'BALANCEO '+ln.nombre:'BALANCEO SIN TÍTULO';}if(!TK.studies.includes(d))TK.studies.unshift(d);}
    TK.view=D.tkv;TK.sel=null;render();return;}
  if(D.tkimp){const st=DS.studies.find(x=>x.id==D.tkimp);if(st&&!tkHas(d,st))tkImport(d,st);tkRe();return;}
  if(D.tkimpall){tkWeList(d).filter(st=>!tkHas(d,st)).forEach(st=>tkImport(d,st));tkRe();return;}
  if(D.tkexample){TK_EXAMPLE.forEach(([n,els])=>{const sid=nid();d.estaciones.push({id:sid,nombre:n});els.forEach(([name,tt])=>d.els.push({id:nid(),name,t:String(tt),st:sid,st0:sid}));});tkRe();return;}
  if(D.tkstadd){d.estaciones.push({id:nid(),nombre:'EST '+(d.estaciones.length+1)*10});tkRe();return;}
  if(D.tkeadd){const sid=+D.tkeadd;d.els.push({id:nid(),name:'',t:'',st:sid,st0:sid});tkRe();const ins=document.querySelectorAll(`[data-tken]`);const last=[...ins].filter(i=>{const el=d.els.find(x=>x.id==i.dataset.tken);return el&&el.st===sid;}).pop();if(last)last.focus({preventScroll:true});return;}
  if(D.tkedel){d.els=d.els.filter(x=>x.id!=D.tkedel);tkRe();return;}
  if(D.tkstdel){const sid=+D.tkstdel;const s=d.estaciones.find(x=>x.id===sid);const n=d.els.filter(x=>x.st===sid).length;
    const go2=()=>{d.els=d.els.filter(x=>x.st!==sid);d.els.forEach(x=>{if(x.st0===sid)x.st0=x.st;});d.estaciones=d.estaciones.filter(x=>x.id!==sid);tkRe();};
    if(n)ask('¿Quitar «'+s.nombre+'»?','Se quitan también sus '+n+' elemento'+(n!==1?'s':'')+'.','Quitar estación',go2);else go2();return;}
  if(D.tksel){const id=+D.tksel;TK.sel=TK.sel===id?null:id;tkRe();return;}
  if(D.tkmove){const el=d.els.find(x=>x.id===TK.sel);if(el)el.st=+D.tkmove;TK.sel=null;tkRe();return;}
  if(D.tklaneadd){d.estaciones.push({id:nid(),nombre:'EST NUEVA '+(d.estaciones.filter(s=>s.nueva).length+1),nueva:true});tkRe();return;}
  if(D.tklanedel){const sid=+D.tklanedel;if(d.els.some(x=>x.st===sid))return;d.els.forEach(x=>{if(x.st0===sid)x.st0=x.st;});d.estaciones=d.estaciones.filter(x=>x.id!==sid);tkRe();return;}
  if(D.tkreset){ask('¿Regresar a como se trajo?','Cada elemento vuelve a su estación original y se quitan las estaciones agregadas para simular.','Regresar',()=>{d.els.forEach(x=>x.st=x.st0);d.estaciones=d.estaciones.filter(s=>!s.nueva||d.els.some(x=>x.st===s.id));TK.sel=null;tkRe();},{ok:true,icon:'undo'});return;}
  if(D.tkdel){ask('¿Eliminar este balanceo?','Se borra «'+tkName(d)+'». Los Work Element de donde vino no se tocan.','Eliminar',()=>{TK.studies=TK.studies.filter(x=>x!==d);TK.d=null;go('tk');});return;}

// ===== DIAGRAMA DE ESPAGUETI · por dónde camina el operador (o viaja el material) y cuántos metros =====
// Módulo AISLADO: puntos y recorrido se capturan aquí. Vive en la sección «Diagramas» junto con Flujo de proceso.
// <sp-pure> Funciones puras: se prueban en Node (parts/sptest.js) leyendo este bloque directo de index.html.
function spNum(v){const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?0:x;}
// Distancia de un trayecto en cuadros: en escuadra (por pasillos, |Δx|+|Δy|) o en línea recta
function spLeg(a,b,modo){const dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);return modo==='rec'?Math.hypot(dx,dy):dx+dy;}
const spPairKey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
// Resultados del recorrido (metros = cuadros × escala). Toques seguidos al mismo punto no cuentan como viaje.
function spCalc(d){const esc=spNum(d.escala)||0;const P={};(d.pts||[]).forEach(p=>P[p.id]=p);
  const R=(d.ruta||[]).filter(id=>P[id]);const legs=[];
  for(let i=1;i<R.length;i++){if(R[i]===R[i-1])continue;const a=P[R[i-1]],b=P[R[i]];legs.push({a:a.id,b:b.id,d:spLeg(a,b,d.modo)*esc});}
  const total=legs.reduce((s,l)=>s+l.d,0);
  const pairs=[];const pk={};legs.forEach(l=>{const k=spPairKey(l.a,l.b);if(!pk[k]){pk[k]={a:Math.min(l.a,l.b),b:Math.max(l.a,l.b),n:0,d:l.d,t:0};pairs.push(pk[k]);}pk[k].n++;pk[k].t+=l.d;});
  let top=null;pairs.forEach(p=>{if(!top||p.n>top.n||(p.n===top.n&&p.t>top.t))top=p;});
  const visits={};let seq=[];R.forEach((id,i)=>{if(i&&id===R[i-1])return;seq.push(id);});seq.forEach(id=>visits[id]=(visits[id]||0)+1);
  let topPt=null;Object.keys(visits).forEach(id=>{if(topPt===null||visits[id]>visits[topPt])topPt=+id;});
  const ciclos=spNum(d.ciclos),turnos=spNum(d.turnos),vel=spNum(d.vel);
  const porTurno=ciclos>0?total*ciclos:0,porDia=porTurno&&turnos>0?porTurno*turnos:0;
  return {legs,total,viajes:legs.length,pairs,top:top&&top.n>0?top:null,visits,topPt:legs.length?topPt:null,porTurno,porDia,
    tCiclo:vel>0?total/vel:0,tTurno:vel>0&&porTurno?porTurno/vel:0};}
// </sp-pure>

function spSteps(){const L=[['info','Información'],['lay','Layout'],['ruta','Recorrido'],['res','Resultados']];const idx=L.findIndex(x=>x[0]===SP.view);

// El diagrama: cuadrícula, trayectos (más gruesos si se repiten) y puntos. modo: 'lay' (colocar), 'ruta' (trazar), 'res' (ver)
function spSvg(d,modo){const {c,r}=spDim(d);const S=SP_CELL,W=c*S,H=r*S;const R=spCalc(d);const col=spCol(d);const P={};d.pts.forEach(p=>P[p.id]=p);
  const cx=p=>p.x*S+S/2,cy=p=>p.y*S+S/2;const used={};d.pts.forEach(p=>used[p.x+','+p.y]=1);
  const cells=modo==='lay'?Array.from({length:c*r},(_,i)=>{const x=i%c,y=Math.floor(i/c);return used[x+','+y]?'':`<rect x="${x*S}" y="${y*S}" width="${S}" height="${S}" class="spcell" data-spcell="${x},${y}"/>`;}).join(''):'';
  const grid=Array.from({length:c+1},(_,i)=>`<line x1="${i*S}" y1="0" x2="${i*S}" y2="${H}"/>`).join('')+Array.from({length:r+1},(_,i)=>`<line x1="0" y1="${i*S}" x2="${W}" y2="${i*S}"/>`).join('');
  const paths=R.pairs.map((p,i)=>{const a=P[p.a],b=P[p.b];const w=3+(p.n-1)*3;const dd=d.modo==='rec'?`M${cx(a)},${cy(a)} L${cx(b)},${cy(b)}`:`M${cx(a)},${cy(a)} H${cx(b)} V${cy(b)}`;
    const mx=d.modo==='rec'?(cx(a)+cx(b))/2:(cx(a)+cx(b))/2,my=d.modo==='rec'?(cy(a)+cy(b))/2:cy(a);
    return `<path d="${dd}" class="spleg" style="--i:${i}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".78" pathLength="1"/>${p.n>1?`<g class="spn"><rect x="${mx-15}" y="${my-11}" width="30" height="22" rx="11" fill="#fff" stroke="${col}"/><text x="${mx}" y="${my+4.5}" text-anchor="middle" fill="${col}">×${p.n}</text></g>`:''}`;}).join('');
  const last=d.ruta.length?d.ruta[d.ruta.length-1]:null;
  const pts=d.pts.map((p,i)=>{const on=SP.sel===p.id,isLast=modo==='ruta'&&last===p.id;const v=R.visits[p.id]||0;
    return `<g class="sppt ${on?'on':''} ${isLast?'last':''}" ${modo==='res'?'':`data-sppt="${p.id}" data-spk="${i+1}" tabindex="0" role="button"`} aria-label="${esc(p.n||'Punto')}${v?', '+v+' visita'+(v!==1?'s':''):''}">

      <text x="${cx(p)}" y="${p.y*S+S+13}" text-anchor="middle" class="spl">${uds(String(p.n||'').slice(0,16))}</text></g>`;}).join('');
  return `<svg class="spsvg ${modo==='res'?'anim':''}" viewBox="-2 -2 ${W+4} ${H+20}" style="min-width:${Math.min(W,860)}px" role="img" aria-label="Diagrama de espagueti: ${d.pts.length} puntos, ${R.viajes} viajes">

      ${[...R.pairs].sort((x,y)=>y.t-x.t).map(p=>`<tr><th>${ud(nm(p.a))} ↔ ${ud(nm(p.b))}</th><td>${p.n}</td><td>${fT(p.d.toFixed(2))}</td><td>${fT(p.t.toFixed(2))}</td><td>${pc(R.total?p.t/R.total:0,1)}</td></tr>`).join('')}

  return `${spSteps()}<section class="glass panel ${S.keep?'':'view'}">${body}</section>`;
