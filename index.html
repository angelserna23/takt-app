const storeTut=()=>typeof TR!=='undefined'&&!!TR;

function storeOpen(){return new Promise((res,rej)=>{let rq;try{rq=indexedDB.open('takt',1);}catch(e){rej(e);return;}
  rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains('estudios'))db.createObjectStore('estudios',{keyPath:'uuid'});if(!db.objectStoreNames.contains('ajustes'))db.createObjectStore('ajustes',{keyPath:'key'});};
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);rq.onblocked=()=>rej(new Error('Almacén bloqueado por otra pestaña'));});}
const storeReq=(r)=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
function storeTx(names,mode,fn){return new Promise((res,rej)=>{const tx=STORE.db.transaction(names,mode);let out;try{out=fn(tx);}catch(e){rej(e);return;}tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Transacción cancelada'));});}

// Al abrir la app: lee todo, migra si hace falta y llena las listas de cada formato.
async function storeInit(){
  try{STORE.db=await storeOpen();STORE.ok=true;}
  catch(e){STORE.err='Este navegador no permite guardar. Lo que captures se pierde al cerrar.';console.warn('[almacén]',e);STORE.ready=true;return;}
  try{
    const all=await storeTx(['estudios'],'readonly',tx=>storeReq(tx.objectStore('estudios').getAll()));
    const ajs=await storeTx(['ajustes'],'readonly',tx=>storeReq(tx.objectStore('ajustes').getAll()));
    (ajs||[]).forEach(a=>{if(a.key==='lang'&&(a.value==='es'||a.value==='en'))LANG=a.value;if(a.key==='stcat'&&a.value&&typeof a.value==='object')ST.cat=a.value;if(a.key==='catalogo'&&a.value&&Array.isArray(a.value.plantas))CAT.plantas=a.value.plantas;});
    const bad=[];
    (all||[]).sort((a,b)=>String(b.savedAt).localeCompare(String(a.savedAt))).forEach(env=>{
      if(!STORE_KINDS.includes(env.kind)){bad.push(env.uuid);return;}
      let e;try{e=storeMigrate(env,STORE_SCHEMA[env.kind],STORE_MIGS[env.kind]);}catch(err){bad.push(env.kind+': '+err.message);return;}
      const d=e.data;d._uuid=e.uuid;storeBox(e.kind).studies.push(d);STORE.saved.set(e.uuid,JSON.stringify(d));
      if(e.schema!==env.schema)storePut(e.kind,d,env);  // deja guardada la versión ya migrada
    });
    const sf=(ajs||[]).find(a=>a.key==='semilla');
    if(SEED_ON&&!navigator.webdriver&&(!sf||sf.value!==SEED_VER))await seedLoad().catch(e=>console.warn('[semilla]',e));
    uid=Math.max(uid,storeMaxId({S:S.studies,DS:DS.studies,ST:ST.studies,MM:MM.studies,SM:SM.studies,PC:PC.studies,AT:AT.studies,DF:DF.studies,TK:TK.studies,HS:HS.studies,SP:SP.studies,cat:ST.cat}));
    if(bad.length){STORE.err='No se pudieron abrir '+bad.length+' estudio(s) guardados.';console.warn('[almacén]',bad);}
  }catch(e){STORE.err='No se pudo leer lo guardado.';console.warn('[almacén]',e);}
  STORE.ready=true;
}
async function storePut(kind,d,prevEnv){
  const prev=prevEnv||await storeTx(['estudios'],'readonly',tx=>storeReq(tx.objectStore('estudios').get(d._uuid))).catch(()=>null);
  const env=storeEnvelope(kind,d,STORE_SCHEMA[kind]||1,new Date().toISOString(),await prev);
  await storeTx(['estudios','ajustes'],'readwrite',tx=>{tx.objectStore('estudios').put(env);if(kind==='st')tx.objectStore('ajustes').put({key:'stcat',value:JSON.parse(JSON.stringify(ST.cat))});});
}
// Guardar (lo llama el botón Guardar de cada formato). Todo o nada: se guarda el estudio completo en una transacción.
function storeSave(kind,d){
  if(storeTut()||!d)return;
  if(!d._uuid)d._uuid=storeUUID();
  const box=storeBox(kind);if(!box.studies.includes(d))box.studies.unshift(d);
  const json=JSON.stringify(d);
  if(!STORE.ok){storeToast(STORE.err||'No se puede guardar en este navegador','err');return;}
  storePut(kind,d).then(()=>{STORE.saved.set(d._uuid,json);storeToast('Guardado ✓');storeChip();storeDecorate();})
    .catch(e=>{console.warn('[almacén]',e);storeToast(/quota/i.test(String(e&&e.name||e))?'Sin espacio para guardar en este dispositivo':'No se pudo guardar. Intenta de nuevo.','err');});
}
function storeRemove(uuid){STORE.saved.delete(uuid);if(STORE.ok)storeTx(['estudios'],'readwrite',tx=>tx.objectStore('estudios').delete(uuid)).catch(e=>console.warn('[almacén]',e));}
// Si un estudio guardado ya no está en ninguna lista, es que se eliminó: se borra del almacén.
function storeReconcile(){if(storeTut()||!STORE.ready)return;const live=new Set();
  STORE_KINDS.forEach(k=>storeBox(k).studies.forEach(d=>{if(d&&d._uuid)live.add(d._uuid);}));
  [...STORE.saved.keys()].forEach(u=>{if(!live.has(u))storeRemove(u);});}
// Descartar cambios sin guardar: regresa el estudio a como quedó guardado.
function storeDiscard(d){const j=d&&d._uuid&&STORE.saved.get(d._uuid);if(!j)return;const o=JSON.parse(j);Object.keys(d).forEach(k=>delete d[k]);Object.assign(d,o);}

// ¿Qué estudio está abierto en la pantalla actual? (para el indicador de guardado)
function storeCurrent(){const r=route();
  if(r==='ws-nuevo')return['ws',S.draft];if(r==='ds-nuevo'||r==='we-nuevo')return[(DS.d&&DS.d.kind)||'ds',DS.d];
  if(r==='st-nuevo')return['st',ST.d];if(r==='mm-nuevo')return['mm',MM.d];if(r==='sm-nuevo')return['sm',SM.d];
  if(r==='pc-nuevo')return['pc',PC.d];if(r==='tk-nuevo')return['tk',TK.d];if(r==='hs-nuevo')return['hs',HS.d];if(r==='sp-nuevo')return['sp',SP.d];if(r==='at-nuevo')return['at',AT.d];if(r==='df-nuevo')return['df',DF.d];return[null,null];}
function storeChip(){const el=document.getElementById('savechip');if(!el)return;const[k,d]=storeCurrent();
  if(storeTut()||!k||!d){el.hidden=true;return;}
  const st=storeStateOf(d,STORE.saved);const inList=storeBox(k).studies.includes(d);
  if(st==='nuevo'&&!inList){el.hidden=true;return;}
  el.hidden=false;el.className='savechip '+st;el.textContent=st==='ok'?'Guardado ✓':st==='cambios'?'Cambios sin guardar':'Sin guardar';}
// Marca en las listas: SIN GUARDAR / CAMBIOS SIN GUARDAR (+ descartar cambios)
function storeDecorate(){if(storeTut())return;document.querySelectorAll('#view [data-sdel]').forEach(b=>{
  const[k,id]=b.dataset.sdel.split('|');const d=storeBox(k)&&storeBox(k).studies.find(x=>x.id==id);if(!d)return;
  const row=b.closest('.studyrow');if(!row)return;row.querySelectorAll('.savetag,.savediscard').forEach(x=>x.remove());
  const st=storeStateOf(d,STORE.saved);if(st==='ok')return;
  const meta=row.querySelector('.meta b')||row.querySelector('b');if(!meta)return;
  meta.insertAdjacentHTML('beforeend',`<span class="tag savetag ${st}">${st==='nuevo'?'SIN GUARDAR':'CAMBIOS SIN GUARDAR'}</span>`);
  if(st==='cambios')b.insertAdjacentHTML('beforebegin',`<button type="button" class="btn ghost sm savediscard" data-storediscard="${k}|${d.id}" title="Regresar a como quedó guardado">Descartar cambios</button>`);});}
function storeUnsaved(){if(storeTut())return [];const out=[];
  STORE_KINDS.forEach(k=>storeBox(k).studies.forEach(d=>{if((k==='we')!==(d.kind==='we')&&(k==='ds'||k==='we'))return;if(storeStateOf(d,STORE.saved)!=='ok')out.push(d);}));
  return out;}
let storeToastT=null;
function storeToast(msg,kind){let t=document.getElementById('savetoast');if(!t){t=document.createElement('div');t.id='savetoast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t);}
  t.textContent=msg;t.className=kind==='err'?'err show':'show';clearTimeout(storeToastT);storeToastT=setTimeout(()=>t.className=t.className.replace('show',''),kind==='err'?5000:1800);}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-storediscard]');if(b){e.stopPropagation();const[k,id]=b.dataset.storediscard.split('|');const d=storeBox(k).studies.find(x=>x.id==id);
    ask('¿Descartar los cambios?','El estudio regresa a como quedó la última vez que lo guardaste.','Descartar cambios',()=>{storeDiscard(d);render();},{ok:true,icon:'undo'});return;}
  setTimeout(()=>{storeReconcile();storeChip();},0);},true);
let storeInT=null;document.addEventListener('input',()=>{clearTimeout(storeInT);storeInT=setTimeout(storeChip,300);});
// Aviso al salir con algo sin guardar (el navegador muestra su propio mensaje)
window.addEventListener('beforeunload',e=>{if(storeUnsaved().length){e.preventDefault();e.returnValue='';}});
// Gancho para las pruebas automáticas
window.TaktStore={dump:k=>JSON.stringify(storeBox(k).studies.filter(d=>(k==='we')===(d.kind==='we')||!['ds','we'].includes(k))),ready:()=>STORE.ready,ok:()=>STORE.ok,err:()=>STORE.err,saved:()=>[...STORE.saved.keys()],unsaved:()=>storeUnsaved().length,uid:()=>uid,
  state:k=>{const[kk,d]=storeCurrent();return d?storeStateOf(d,STORE.saved):null;}};

// ================= Jerarquía de planta: Planta → Área → Línea → Estación (Guardado Fase 2) =================
// El catálogo vive aparte de los estudios; cada estudio guarda solo los identificadores (d.ubic = {planta, area, linea, estacion}).
// Así, renombrar una línea no toca ningún estudio y el tablero podrá agrupar por línea.
// El catálogo se guarda al momento en cada cambio (cada acción es completa: agregar, renombrar o quitar un nodo).
const CAT={plantas:[]};
const UB_LV=['planta','area','linea','estacion'];
const UB_LBL={planta:'Planta',area:'Área',linea:'Línea',estacion:'Estación'};
const UB_KIDS={planta:'areas',area:'lineas',linea:'estaciones'};
// Hasta qué nivel llega el selector de cada formato, y qué nivel se pide (Angel, 2026-11-12). «Sin asignar» siempre se permite.
const UB_DEEP={ws:4,ds:4,we:4,st:4,sm:4,mm:3,pc:2,at:2,df:3,tk:3,hs:4,sp:3};
const UB_REQ={ws:3,ds:3,we:3,st:3,sm:3,mm:3,pc:2,at:2,df:1,tk:3,hs:4,sp:2};
const UB={adding:null};            // nivel que se está agregando desde el selector
const UBF={planta:'',area:'',linea:''};  // filtro de las listas
// Hijos de un nodo (o las plantas si no hay padre)
function ubKids(lv,parentId){if(lv==='planta')return CAT.plantas;const up=UB_LV[UB_LV.indexOf(lv)-1];const p=ubFind(up,parentId);return p?(p[UB_KIDS[up]]||(p[UB_KIDS[up]]=[])):[];}
function ubFind(lv,id){if(!id)return null;const walk=(arr,l)=>{for(const n of arr||[]){if(l===lv&&n.id===id)return n;const k=UB_KIDS[l];if(k&&UB_LV.indexOf(l)<UB_LV.indexOf(lv)){const r=walk(n[k],UB_LV[UB_LV.indexOf(l)+1]);if(r)return r;}}return null;};return walk(CAT.plantas,'planta');}
const ubOf=d=>d.ubic||(d.ubic={});
function ubLabel(d){const u=d&&d.ubic||{};const names=UB_LV.map(l=>{const n=ubFind(l,u[l]);return n?n.nombre:null;}).filter(Boolean);return names.length?names.join(' › '):'Sin asignar';}
function ubAllStudies(){const out=[];STORE_KINDS.forEach(k=>{if(k==='we')return;storeBox(k).studies.forEach(d=>out.push(d));});return out;}
function ubUsed(lv,id){return ubAllStudies().filter(d=>d.ubic&&d.ubic[lv]===id).length;}
function ubSubtreeUsed(lv,node){let n=ubUsed(lv,node.id);const k=UB_KIDS[lv];if(k)(node[k]||[]).forEach(c=>n+=ubSubtreeUsed(UB_LV[UB_LV.indexOf(lv)+1],c));return n;}
function catSave(){if(storeTut())return;if(!STORE.ok){storeToast(STORE.err||'No se puede guardar en este navegador','err');return;}
  storeTx(['ajustes'],'readwrite',tx=>tx.objectStore('ajustes').put({key:'catalogo',value:JSON.parse(JSON.stringify(CAT))})).catch(e=>{console.warn('[catálogo]',e);storeToast('No se pudo guardar el catálogo','err');});}
function ubAdd(lv,parentId,nombre){const n={id:storeUUID(),nombre:String(nombre).trim().toLocaleUpperCase('es-MX')};if(UB_KIDS[lv]){n[UB_KIDS[lv]]=[];CATO.open.add(n.id);}ubKids(lv,parentId).push(n);catSave();return n;}

// Selector de ubicación (va en la Información de cada formato)
function ubicPicker(kind,d){const u=ubOf(d);const deep=UB_DEEP[kind]||3,req=UB_REQ[kind]||1;
  const lvs=UB_LV.slice(0,deep);
  const sel=(lv,i)=>{const parent=i?u[UB_LV[i-1]]:null;const off=i&&!parent;const opts=off?[]:ubKids(lv,parent);
    return `<label class="ubicf ${i<req&&!u[lv]?'want':''}"><span>${UB_LBL[lv]}${i<req?' <span class="req" aria-hidden="true">*</span>':''}</span>
      <span class="ubicsel"><select data-ubic="${lv}" ${off?'disabled':''}><option value="">${off?'Falta '+UB_LBL[UB_LV[i-1]].toLowerCase():'Sin asignar'}</option>${opts.map(n=>`<option translate="no" value="${n.id}" ${u[lv]===n.id?'selected':''}>${esc(n.nombre)}</option>`).join('')}</select>
      <button type="button" class="iconbtn" data-ubicnew="${lv}" ${off?'disabled':''} aria-label="Agregar ${UB_LBL[lv].toLowerCase()}" title="Agregar ${UB_LBL[lv].toLowerCase()}">${svg('plus',18,2.2)}</button></span></label>`;};
  const adding=UB.adding&&lvs.includes(UB.adding)?`<div class="ubicadd"><input id="ubicnewin" autocomplete="off" placeholder="Nombre de la nueva ${UB_LBL[UB.adding].toLowerCase()}"><button type="button" class="btn sm" data-ubicadd="1">Agregar ${UB_LBL[UB.adding].toLowerCase()}</button><button type="button" class="btn ghost sm" data-ubiccancel="1">Cancelar</button></div>`:'';
  return `<div class="ubic" style="margin-top:16px"><span class="mmlbl">Ubicación <span class="hint">se pide hasta ${UB_LBL[UB_LV[req-1]].toLowerCase()} · «Sin asignar» está permitido, pero así no aparecerá agrupado en el tablero</span></span>
    <div class="ubicrow">${lvs.map(sel).join('')}</div>${adding}</div>`;}
function ubSet(d,lv,val){const u=ubOf(d);const i=UB_LV.indexOf(lv);u[lv]=val||undefined;UB_LV.slice(i+1).forEach(l=>delete u[l]);if(!val)delete u[lv];}
document.addEventListener('change',e=>{const s=e.target;if(!s.dataset)return;
  if(s.dataset.ubic){const[,d]=storeCurrent();if(!d)return;ubSet(d,s.dataset.ubic,s.value);UB.adding=null;S.keep=true;render(true);S.keep=false;return;}
  if(s.dataset.ubf){const i=UB_LV.indexOf(s.dataset.ubf);UBF[s.dataset.ubf]=s.value;UB_LV.slice(i+1).forEach(l=>{if(l in UBF)UBF[l]='';});S.keep=true;render(true);S.keep=false;return;}
  if(s.dataset.catname){const[lv,id]=s.dataset.catname.split('|');const n=ubFind(lv,id);const v=s.value.trim().toLocaleUpperCase('es-MX');if(n&&v){n.nombre=v;catSave();storeToast('Guardado ✓');}else if(n)s.value=n.nombre;return;}});
function ubAddFromPicker(){const[,d]=storeCurrent();const inp=document.getElementById('ubicnewin');if(!d||!inp||!inp.value.trim()||!UB.adding)return;
  const lv=UB.adding;const i=UB_LV.indexOf(lv);const parent=i?ubOf(d)[UB_LV[i-1]]:null;if(i&&!parent)return;
  const n=ubAdd(lv,parent,inp.value);ubSet(d,lv,n.id);UB.adding=null;storeToast(UB_LBL[lv]+' agregada al catálogo ✓');S.keep=true;render(true);S.keep=false;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;const D=b.dataset;
  if(D.ubicnew){UB.adding=D.ubicnew;S.keep=true;render(true);S.keep=false;const i=document.getElementById('ubicnewin');if(i)i.focus({preventScroll:true});return;}
  if(D.ubiccancel){UB.adding=null;S.keep=true;render(true);S.keep=false;return;}
  if(D.ubicadd){ubAddFromPicker();return;}
  if(D.catadd!==undefined){const[lv,parent]=D.catadd.split('|');const inp=document.querySelector(`[data-catnew="${D.catadd}"]`);const v=inp&&inp.value.trim();
    if(!v){if(inp){inp.focus();inp.classList.add('miss');}return;}ubAdd(lv,parent||null,v);storeToast(UB_LBL[lv]+' agregada ✓');S.keep=true;render(true);S.keep=false;
    const ni=document.querySelector(`[data-catnew="${D.catadd}"]`);if(ni)ni.focus({preventScroll:true});return;}
  if(D.catdel){const[lv,id]=D.catdel.split('|');const n=ubFind(lv,id);if(!n)return;const used=ubSubtreeUsed(lv,n);
    if(used){storeToast('No se puede quitar «'+n.nombre+'»: la usan '+used+' estudio'+(used!==1?'s':'')+'. Cámbialos primero.','err');return;}
    const k=UB_KIDS[lv];const kids=k?(n[k]||[]).length:0;
    ask('¿Quitar '+UB_LBL[lv].toLowerCase()+' «'+n.nombre+'»?',kids?'También se quitan sus '+kids+' '+UB_LBL[UB_LV[UB_LV.indexOf(lv)+1]].toLowerCase()+(kids!==1?'s':'')+' y lo que tengan dentro. Ningún estudio las usa.':'Ningún estudio la usa.','Quitar',()=>{
      const arr=lv==='planta'?CAT.plantas:(()=>{let found=null;const walk=(a,l)=>{(a||[]).forEach(x=>{const kk=UB_KIDS[l];if(kk&&(x[kk]||[]).some(c=>c.id===id))found=x[kk];else if(kk)walk(x[kk],UB_LV[UB_LV.indexOf(l)+1]);});};walk(CAT.plantas,'planta');return found;})();
      if(arr){const j=arr.findIndex(x=>x.id===id);if(j>=0)arr.splice(j,1);}catSave();render(true);});return;}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target)return;
  if(e.target.id==='ubicnewin'){e.preventDefault();ubAddFromPicker();return;}
  if(e.target.dataset&&e.target.dataset.catnew!==undefined){e.preventDefault();const b=document.querySelector(`[data-catadd="${e.target.dataset.catnew}"]`);if(b)b.click();}});

// Catálogo en Configuración
// Catálogo compacto (Angel, 2026-11-13): la sección y cada planta, área y línea se pliegan; todo arranca cerrado al cargar la página.
// Lo abierto se recuerda solo mientras la página está abierta; lo que se agrega queda abierto para seguir capturando.
const CATO={sec:false,open:new Set()};
function vCatalogo(){
  const cnt=(lv,arr)=>arr.length+' '+(arr.length===1?UB_LBL[lv].toLowerCase():{area:'áreas',linea:'líneas',estacion:'estaciones',planta:'plantas'}[lv]);
  const tog=(key,open,lbl,txt)=>`<button type="button" class="cattog" data-cattog="${key}" aria-expanded="${open}" aria-label="${open?'Cerrar':'Abrir'} ${esc(lbl)}">${svg('next',16,2.4)}${txt?`<span>${txt}</span>`:''}</button>`;
  const node=(lv,n)=>{const i=UB_LV.indexOf(lv);const k=UB_KIDS[lv];const used=ubUsed(lv,n.id);const child=UB_LV[i+1];const open=!!k&&CATO.open.has(n.id);const kids=k?(n[k]||[]):[];
    return `<div class="catn lv${i}"><div class="cath">${k?tog(lv+'|'+n.id,open,UB_LBL[lv].toLowerCase()+' '+n.nombre,cnt(child,kids)):'<span class="cattog sp"></span>'}<span class="catlv">${UB_LBL[lv]}</span><input data-catname="${lv}|${n.id}" value="${esc(n.nombre)}" aria-label="Nombre de ${UB_LBL[lv].toLowerCase()}" autocomplete="off">
      <span class="sub" style="margin:0;white-space:nowrap">${used?used+' estudio'+(used!==1?'s':''):''}</span><button type="button" class="iconbtn" data-catdel="${lv}|${n.id}" aria-label="Quitar ${UB_LBL[lv].toLowerCase()} ${esc(n.nombre)}">${svg('trash',16)}</button></div>
      ${open?`<div class="catk">${kids.map(c=>node(child,c)).join('')}${addRow(child,n.id)}</div>`:''}</div>`;};
  const addRow=(lv,parent)=>`<div class="catadd"><input data-catnew="${lv}|${parent||''}" autocomplete="off" placeholder="Nueva ${UB_LBL[lv].toLowerCase()}"><button type="button" class="btn ghost sm" data-catadd="${lv}|${parent||''}">${svg('plus',16,2.2)} ${UB_LBL[lv]}</button></div>`;
  const all=lv=>{const out=[];const walk=(arr,l)=>(arr||[]).forEach(n=>{if(l===lv)out.push(n);else if(UB_KIDS[l])walk(n[UB_KIDS[l]],UB_LV[UB_LV.indexOf(l)+1]);});walk(CAT.plantas,'planta');return out;};
  const resumen=['planta','area','linea','estacion'].map(l=>cnt(l,all(l))).join(' · ');
  return `<section class="glass panel" id="catalogo"><div class="row cathead">${tog('sec',CATO.sec,'plantas, áreas, líneas y estaciones','')}<div style="flex:1;min-width:0"><h2>Plantas, áreas, líneas y estaciones</h2><p class="sub">${CATO.sec?'La ubicación de cada estudio. Renombrar no afecta los estudios; solo se puede quitar lo que ningún estudio usa. Se guarda al momento.':esc(resumen)+' · toca para abrir'}</p></div></div>
    ${CATO.sec?`<div class="catree">${CAT.plantas.map(p=>node('planta',p)).join('')||'<div class="slot empty" style="min-height:120px"><p>Aún no hay plantas. Agrega la primera; también puedes crearlas desde la Información de cualquier estudio.</p></div>'}${addRow('planta',null)}</div>`:''}</section>`;}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-cattog],#catalogo .cathead h2,#catalogo .cathead .sub');if(!t)return;
  const key=t.dataset&&t.dataset.cattog||'sec';if(key==='sec')CATO.sec=!CATO.sec;else{const id=key.split('|')[1];CATO.open.has(id)?CATO.open.delete(id):CATO.open.add(id);}
  S.keep=true;render(true);S.keep=false;const b=document.querySelector(`[data-cattog="${key}"]`);if(b)b.focus({preventScroll:true});});

// Listas: ubicación de cada estudio + filtro por planta, área y línea
function ubicDecorate(){if(storeTut())return;const rows=[...document.querySelectorAll('#view [data-sdel]')];const r=route();
  const isList=['ws','ds','we','st','mm','sm','pc','at','df','tk','hs','sp'].includes(r);if(!isList)return;
  const panel=document.querySelector('#view section.panel');if(panel&&!panel.querySelector('.ubfilter')&&CAT.plantas.length){

async function seedLoad(){if(!STORE.ok||!SEED.est.length)return 0;
  (SEED.cat.plantas||[]).forEach(pl=>{if(!CAT.plantas.some(x=>x.id===pl.id))CAT.plantas.push(JSON.parse(JSON.stringify(pl)));});
  const rows=SEED.est.map(([kind,uuid,savedAt,schema,data])=>{const e=storeMigrate({uuid,kind,schema,data},STORE_SCHEMA[kind],STORE_MIGS[kind]);const d=JSON.parse(JSON.stringify(e.data));d._uuid=uuid;
    return {kind,d,env:{uuid,kind,schema:e.schema,createdAt:savedAt,savedAt,data:JSON.parse(JSON.stringify(d))}};});
  await storeTx(['estudios','ajustes'],'readwrite',tx=>{const os=tx.objectStore('estudios');rows.forEach(r=>os.put(r.env));
    tx.objectStore('ajustes').put({key:'catalogo',value:JSON.parse(JSON.stringify(CAT))});tx.objectStore('ajustes').put({key:'semilla',value:SEED_VER});});
  rows.forEach(({kind,d})=>{const box=storeBox(kind);const i=box.studies.findIndex(x=>x._uuid===d._uuid);if(i>=0)box.studies[i]=d;else box.studies.push(d);STORE.saved.set(d._uuid,JSON.stringify(d));});
  uid=Math.max(uid,storeMaxId({S:S.studies,DS:DS.studies,ST:ST.studies,MM:MM.studies,SM:SM.studies,PC:PC.studies,AT:AT.studies,DF:DF.studies,TK:TK.studies,HS:HS.studies,SP:SP.studies,cat:ST.cat}));
  return rows.length;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-seedload]');if(!b)return;
  ask('Historial de ejemplo','Se vuelven a cargar los '+SEED.est.length+' estudios ficticios (los que borraste regresan; los tuyos no se tocan).','Cargar',()=>{seedLoad().then(()=>location.reload()).catch(err=>{console.warn('[semilla]',err);storeToast('No se pudo cargar el historial','err');});});});
window.TaktSeed={load:()=>seedLoad(),count:()=>SEED.est.length,
  orphans:()=>ubAllStudies().filter(d=>d.ubic&&d.ubic.planta&&!ubFind('planta',d.ubic.planta)).length};
storeInit().finally(()=>{langApply();render();});
})();
